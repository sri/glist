<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grocery List</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f0e3;
        --bg-accent: #efe0ba;
        --panel: rgba(255, 251, 244, 0.92);
        --panel-strong: #fff7eb;
        --panel-soft: rgba(255, 255, 255, 0.68);
        --ink: #263127;
        --muted: #617060;
        --fresh: #296347;
        --fresh-soft: rgba(41, 99, 71, 0.12);
        --warm: #d96f32;
        --warm-soft: rgba(217, 111, 50, 0.14);
        --done: #8f978d;
        --shadow: 0 24px 50px rgba(78, 60, 32, 0.16);
        --blob-top: rgba(124, 184, 116, 0.22);
        --blob-bottom: rgba(255, 190, 118, 0.22);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Avenir Next Rounded", "Nunito", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.65), transparent 30%),
          radial-gradient(circle at bottom left, rgba(217, 111, 50, 0.18), transparent 28%),
          linear-gradient(160deg, var(--bg) 0%, #f2ebd9 50%, var(--bg-accent) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        pointer-events: none;
        border-radius: 999px;
        filter: blur(10px);
        opacity: 0.45;
      }

      body::before {
        width: 220px;
        height: 220px;
        top: -60px;
        right: -40px;
        background: var(--blob-top);
      }

      body::after {
        width: 280px;
        height: 280px;
        left: -120px;
        bottom: 8vh;
        background: var(--blob-bottom);
      }

      .app {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }

      .shell {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 34px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .flip-stage {
        position: relative;
        overflow: hidden;
        perspective: 1600px;
        transition: height 260ms ease;
      }

      .flip-card {
        position: relative;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .shell.is-flipped .flip-card {
        transform: rotateY(180deg);
      }

      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 20px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .panel-back {
        transform: rotateY(180deg);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 16px 0;
      }

      .panel-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
        width: 100%;
      }

      .search-wrap {
        padding: 0 16px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-radius: var(--radius-xl);
        background: var(--panel-strong);
        border: 1px solid rgba(68, 81, 66, 0.08);
        box-shadow: 0 14px 28px rgba(90, 72, 40, 0.08);
      }

      .search-box input,
      .add-form input,
      .store-form input {
        width: 100%;
        border: 0;
        outline: 0;
        padding: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 1.08rem;
      }

      .search-box input::placeholder,
      .add-form input::placeholder,
      .store-form input::placeholder {
        color: #7c8677;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 16px;
      }

      .action-btn {
        min-height: 44px;
        padding: 10px 15px;
        border: 0;
        border-radius: 999px;
        background: var(--warm-soft);
        color: var(--warm);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, opacity 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .action-btn.alt {
        background: var(--fresh-soft);
        color: var(--fresh);
      }

      .action-btn:active {
        transform: scale(0.985);
      }

      .action-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .action-btn:not(:disabled):hover {
        transform: translateY(-1px);
      }

      .add-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 0 16px;
      }

      .store-section {
        display: grid;
        gap: 10px;
        padding: 0 16px;
      }

      .store-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .store-list {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .store-circle {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .store-circle.active {
        background: rgba(217, 111, 50, 0.18);
        color: var(--warm);
      }

      .store-circle.add-circle {
        background: var(--warm-soft);
        color: var(--warm);
      }

      .store-circle:active {
        transform: scale(0.985);
      }

      .store-form[hidden] {
        display: none;
      }

      .store-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .add-field {
        display: flex;
        align-items: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: var(--radius-xl);
        background: var(--panel-strong);
        border: 1px solid rgba(68, 81, 66, 0.08);
        box-shadow: 0 14px 28px rgba(90, 72, 40, 0.08);
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0 16px;
      }

      .item {
        margin-bottom: 12px;
      }

      .shopping-row,
      .catalog-main {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 18px 18px 18px 20px;
        border: 0;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        color: inherit;
        text-align: left;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .shopping-row:active,
      .catalog-main:active,
      .catalog-action:active {
        transform: scale(0.985);
      }

      .shopping-row:focus-visible,
      .catalog-main:focus-visible,
      .catalog-action:focus-visible,
      .store-circle:focus-visible,
      .store-group-icon:focus-visible,
      .action-btn:focus-visible {
        outline: 3px solid rgba(41, 99, 71, 0.24);
        outline-offset: 3px;
      }

      .shopping-item:not(.done) .shopping-row:hover,
      .catalog-main:hover,
      .catalog-action:hover,
      .store-circle:hover,
      .store-group-icon:hover {
        transform: translateY(-1px);
      }

      .item-main {
        display: grid;
        gap: 6px;
      }

      .item-name {
        font-size: 1.3rem;
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .item-note {
        font-size: 0.92rem;
        color: var(--muted);
      }

      .item-meta {
        font-size: 0.82rem;
        color: var(--muted);
        opacity: 0.92;
      }

      .toggle {
        min-width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(98, 112, 96, 0.08);
        border: 2px solid rgba(98, 112, 96, 0.48);
        color: #586456;
        font-size: 1.3rem;
        font-weight: 900;
        padding: 0 12px;
      }

      .catalog-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
      }

      .catalog-main {
        grid-template-columns: 1fr;
      }

      .catalog-actions {
        display: grid;
        gap: 10px;
        align-content: stretch;
        align-items: end;
      }

      .catalog-action {
        min-width: 102px;
        padding: 0 14px;
        border: 0;
        border-radius: 18px;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font: inherit;
        font-weight: 800;
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .catalog-action.shopping-action {
        background: rgba(217, 111, 50, 0.14);
        color: var(--warm);
      }

      .catalog-store-choices {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 160px;
      }

      .item-store-choice {
        width: 36px;
        height: 36px;
      }

      .shopping-groups {
        display: grid;
        gap: 14px;
        padding: 0 16px;
      }

      .store-group {
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(68, 81, 66, 0.08);
        overflow: hidden;
      }

      .store-group-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px 0;
      }

      .store-group-toggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 4px 4px 12px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .store-group-icon {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font: inherit;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .store-group-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .store-group-title strong {
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .store-group-title span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .store-group-chevron {
        font-size: 1rem;
        color: var(--muted);
      }

      .store-group-body {
        display: grid;
        padding: 0 14px 14px;
      }

      .store-group.collapsed .store-group-body {
        display: none;
      }

      .store-group-items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .item.done {
        opacity: 0.84;
      }

      .shopping-item.done .shopping-row {
        background: rgba(247, 240, 228, 0.86);
      }

      .item.done .item-name {
        color: var(--done);
        text-decoration: line-through;
        text-decoration-thickness: 3px;
        text-decoration-color: rgba(143, 151, 141, 0.85);
      }

      .item.done .item-note {
        color: #8b8f86;
      }

      .item.done .toggle {
        background: rgba(217, 111, 50, 0.14);
        border-color: rgba(217, 111, 50, 0.18);
        color: var(--warm);
      }

      .catalog-item.on-list .catalog-action.shopping-action {
        background: rgba(217, 111, 50, 0.22);
      }

      .empty {
        margin: 8px 16px 0;
        padding: 22px 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.62);
        color: var(--muted);
        text-align: center;
        font-size: 1rem;
      }

      @media (max-width: 480px) {
        .app {
          padding-left: 10px;
          padding-right: 10px;
        }

        .shell {
          border-radius: 28px;
        }

        .panel-header,
        .search-wrap,
        .store-section,
        .toolbar,
        .add-form,
        .list,
        .shopping-groups {
          padding-left: 12px;
          padding-right: 12px;
        }

        .shopping-row,
        .catalog-main {
          padding: 17px 16px 17px 18px;
        }

        .item-name {
          font-size: 1.18rem;
        }

        .add-form {
          grid-template-columns: 1fr;
        }

        .store-form {
          grid-template-columns: 1fr;
        }

        .catalog-card {
          grid-template-columns: 1fr;
        }

        .catalog-actions {
          grid-template-columns: 1fr;
        }

        .catalog-action {
          min-height: 48px;
        }

        .catalog-store-choices {
          justify-content: flex-start;
          max-width: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #081120;
          --bg-accent: #0d213d;
          --panel: rgba(10, 22, 42, 0.9);
          --panel-strong: rgba(16, 31, 58, 0.98);
          --panel-soft: rgba(17, 30, 54, 0.78);
          --ink: #edf4ff;
          --muted: #9bb0cf;
          --fresh: #87d8c7;
          --fresh-soft: rgba(135, 216, 199, 0.16);
          --warm: #ffb36e;
          --warm-soft: rgba(255, 179, 110, 0.14);
          --done: #7f8da7;
          --shadow: 0 26px 60px rgba(0, 0, 0, 0.38);
          --blob-top: rgba(70, 136, 255, 0.22);
          --blob-bottom: rgba(13, 103, 168, 0.24);
        }

        body {
          background:
            radial-gradient(circle at top right, rgba(129, 180, 255, 0.14), transparent 30%),
            radial-gradient(circle at bottom left, rgba(20, 116, 194, 0.2), transparent 28%),
            linear-gradient(160deg, var(--bg) 0%, #07182d 45%, var(--bg-accent) 100%);
        }

        .shell,
        .search-box,
        .add-field,
        .shopping-row,
        .catalog-main,
        .catalog-action,
        .empty {
          border-color: rgba(181, 209, 255, 0.08);
        }

        .search-box,
        .add-field,
        .shopping-row,
        .catalog-main,
        .catalog-action,
        .empty {
          box-shadow: 0 18px 32px rgba(0, 0, 0, 0.24);
        }

        .store-circle {
          background: rgba(130, 169, 224, 0.12);
          color: #98afd1;
        }

        .store-circle.active {
          background: rgba(135, 216, 199, 0.16);
          color: var(--fresh);
        }

        .store-circle.add-circle {
          background: rgba(255, 179, 110, 0.14);
          color: var(--warm);
        }

        .store-group {
          background: rgba(17, 30, 54, 0.42);
          border-color: rgba(181, 209, 255, 0.08);
        }

        .store-group-icon {
          background: rgba(130, 169, 224, 0.12);
          color: #98afd1;
        }

        .empty {
          background: rgba(20, 34, 60, 0.92);
          color: #90a7cb;
        }

        .shopping-item.done .shopping-row {
          background: rgba(12, 24, 44, 0.92);
        }

        .item.done .item-note {
          color: #7988a2;
        }

        .search-box input::placeholder,
        .add-form input::placeholder,
        .store-form input::placeholder {
          color: #7d94b7;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="shell" class="shell">
        <div id="flip-stage" class="flip-stage">
          <div class="flip-card">
            <section id="shopping-panel" class="panel panel-front" aria-label="Shopping list">
              <div class="panel-header">
                <div class="panel-actions">
                  <button id="clear-shopping" class="action-btn alt" type="button">Clear shopping list</button>
                  <button id="move-marked" class="action-btn" type="button">Move marked down</button>
                  <button id="show-catalog" class="action-btn alt" type="button">All items</button>
                </div>
              </div>

              <div class="search-wrap">
                <label class="search-box" for="shopping-search">
                  <input
                    id="shopping-search"
                    type="search"
                    placeholder="search..."
                    aria-label="Search shopping list"
                  />
                </label>
              </div>

              <div id="shopping-list" class="shopping-groups" aria-live="polite"></div>
              <div id="shopping-empty" class="empty" hidden>No matching items.</div>
            </section>

            <section id="catalog-panel" class="panel panel-back" aria-label="All items">
              <div class="panel-header">
                <div class="panel-actions">
                  <button id="show-shopping" class="action-btn alt" type="button">Shopping list</button>
                </div>
              </div>

              <div class="search-wrap">
                <label class="search-box" for="catalog-search">
                  <input
                    id="catalog-search"
                    type="search"
                    placeholder="search..."
                    aria-label="Search all items"
                  />
                </label>
              </div>

              <section class="store-section" aria-label="Stores">
                <div class="store-bar">
                  <div id="store-list" class="store-list"></div>
                  <button id="show-store-form" class="store-circle add-circle" type="button" aria-label="Add store">
                    +
                  </button>
                </div>

                <form id="store-form" class="store-form" hidden>
                  <label class="add-field" for="new-store">
                    <input id="new-store" type="text" placeholder="add store..." aria-label="Add store" />
                  </label>
                  <button class="action-btn alt" type="submit">Add store</button>
                </form>
              </section>

              <form id="add-form" class="add-form">
                <label class="add-field" for="new-item">
                  <input id="new-item" type="text" placeholder="add item..." aria-label="Add item" />
                </label>
                <button class="action-btn" type="submit">Add item</button>
              </form>

              <ul id="catalog-list" class="list"></ul>
              <div id="catalog-empty" class="empty" hidden>No matching items.</div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "glist-state-v2";
      const LEGACY_STORAGE_KEY = "glist-state-v1";
      const seedCatalog = [
        { id: 1, name: "Bananas", note: "6 ripe ones", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 2, name: "Whole milk", note: "1 gallon", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 3, name: "Eggs", note: "Large, 12 count", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 4, name: "Sourdough bread", note: "Bakery section", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 5, name: "Spinach", note: "One big tub", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 6, name: "Chicken thighs", note: "About 2 pounds", done: false, purchaseHistory: [], preferredStoreId: null },
        { id: 7, name: "Greek yogurt", note: "Plain", done: false, purchaseHistory: [], preferredStoreId: null },
        {
          id: 8,
          name: "Peanut butter",
          note: "Crunchy if they have it",
          done: true,
          purchaseHistory: [new Date(Date.now() - 8 * 24 * 60 * 60 * 1000).toISOString()],
          preferredStoreId: null
        },
        {
          id: 9,
          name: "Apples",
          note: "Honeycrisp",
          done: false,
          purchaseHistory: [new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()],
          preferredStoreId: null
        },
        { id: 10, name: "Rice", note: "Jasmine", done: false, purchaseHistory: [], preferredStoreId: null },
        {
          id: 11,
          name: "Pasta sauce",
          note: "Tomato basil",
          done: false,
          purchaseHistory: [new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString()],
          preferredStoreId: null
        },
        { id: 12, name: "Coffee beans", note: "Medium roast", done: false, purchaseHistory: [], preferredStoreId: null }
      ];
      const seedShoppingOrder = [1, 2, 3, 4, 5, 6, 7, 8];
      const seedStores = [];

      function safeReadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return JSON.parse(raw);
          }

          const legacyRaw = window.localStorage.getItem(LEGACY_STORAGE_KEY);
          return legacyRaw ? JSON.parse(legacyRaw) : null;
        } catch (error) {
          return null;
        }
      }

      function normalizeItem(item) {
        return {
          id: Number(item.id),
          name: String(item.name || "").trim(),
          note: String(item.note || "").trim(),
          done: Boolean(item.done),
          purchaseHistory: Array.isArray(item.purchaseHistory)
            ? item.purchaseHistory.filter((entry) => !Number.isNaN(Date.parse(entry)))
            : [],
          preferredStoreId:
            item.preferredStoreId === null || item.preferredStoreId === undefined
              ? null
              : Number.isNaN(Number(item.preferredStoreId))
                ? null
                : Number(item.preferredStoreId)
        };
      }

      function normalizeStore(store) {
        return {
          id: Number(store.id),
          name: String(store.name || "").trim()
        };
      }

      function buildInitialState() {
        const saved = safeReadState();
        const savedCatalog = Array.isArray(saved?.catalog) ? saved.catalog.map(normalizeItem) : null;
        const catalog = savedCatalog && savedCatalog.length > 0 ? savedCatalog : seedCatalog.map(normalizeItem);
        const savedStores = Array.isArray(saved?.stores) ? saved.stores.map(normalizeStore) : null;
        const stores = savedStores
          ? savedStores.filter((store) => store.name)
          : seedStores.map(normalizeStore);
        const validStoreIds = new Set(stores.map((store) => store.id));
        catalog.forEach((item) => {
          if (item.preferredStoreId !== null && !validStoreIds.has(item.preferredStoreId)) {
            item.preferredStoreId = null;
          }
        });
        const validIds = new Set(catalog.map((item) => item.id));
        const savedOrder = Array.isArray(saved?.shoppingOrder)
          ? saved.shoppingOrder.map(Number).filter((id) => validIds.has(id))
          : [];
        const shoppingOrder = Array.isArray(saved?.shoppingOrder)
          ? savedOrder
          : seedShoppingOrder.filter((id) => validIds.has(id));
        const nextId = Math.max(0, ...catalog.map((item) => item.id)) + 1;
        const nextStoreId = Math.max(0, ...stores.map((store) => store.id)) + 1;

        return { catalog, shoppingOrder, stores, nextId, nextStoreId };
      }

      const state = buildInitialState();
      const catalog = state.catalog;
      const itemsById = new Map(catalog.map((item) => [item.id, item]));
      const shoppingOrder = state.shoppingOrder;
      const shoppingSet = new Set(shoppingOrder);
      const stores = state.stores;
      let nextId = state.nextId;
      let nextStoreId = state.nextStoreId;

      const shell = document.getElementById("shell");
      const flipStage = document.getElementById("flip-stage");
      const shoppingPanel = document.getElementById("shopping-panel");
      const catalogPanel = document.getElementById("catalog-panel");
      const shoppingSearch = document.getElementById("shopping-search");
      const catalogSearch = document.getElementById("catalog-search");
      const newItemInput = document.getElementById("new-item");
      const newStoreInput = document.getElementById("new-store");
      const addForm = document.getElementById("add-form");
      const showStoreFormButton = document.getElementById("show-store-form");
      const storeForm = document.getElementById("store-form");
      const clearShoppingButton = document.getElementById("clear-shopping");
      const moveMarkedButton = document.getElementById("move-marked");
      const showCatalogButton = document.getElementById("show-catalog");
      const showShoppingButton = document.getElementById("show-shopping");
      const shoppingList = document.getElementById("shopping-list");
      const catalogList = document.getElementById("catalog-list");
      const storeList = document.getElementById("store-list");
      const shoppingEmpty = document.getElementById("shopping-empty");
      const catalogEmpty = document.getElementById("catalog-empty");

      const shoppingElements = new Map();
      const catalogElements = new Map();
      const collapsedGroups = new Set();
      let isStoreFormOpen = stores.length === 0;

      function persistState() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              catalog,
              shoppingOrder,
              stores
            })
          );
        } catch (error) {
          // Ignore storage failures and keep the UI responsive.
        }
      }

      function getLastPurchased(item) {
        return item.purchaseHistory[item.purchaseHistory.length - 1] || null;
      }

      function getStoreName(storeId) {
        if (storeId === null || storeId === undefined) {
          return "";
        }

        return stores.find((store) => store.id === storeId)?.name || "";
      }

      function formatRelativePurchase(dateString) {
        if (!dateString) {
          return "Never purchased";
        }

        const timestamp = Date.parse(dateString);
        if (Number.isNaN(timestamp)) {
          return "Never purchased";
        }

        const elapsed = Date.now() - timestamp;
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const week = 7 * day;
        const month = 30 * day;
        const year = 365 * day;

        if (elapsed < minute) {
          return "Last purchased just now";
        }

        if (elapsed < hour) {
          const minutes = Math.floor(elapsed / minute);
          return `Last purchased ${minutes} minute${minutes === 1 ? "" : "s"} ago`;
        }

        if (elapsed < day) {
          const hours = Math.floor(elapsed / hour);
          return `Last purchased ${hours} hour${hours === 1 ? "" : "s"} ago`;
        }

        if (elapsed < week) {
          const days = Math.floor(elapsed / day);
          return `Last purchased ${days} day${days === 1 ? "" : "s"} ago`;
        }

        if (elapsed < month) {
          const weeks = Math.floor(elapsed / week);
          return `Last purchased ${weeks} week${weeks === 1 ? "" : "s"} ago`;
        }

        if (elapsed < year) {
          const months = Math.floor(elapsed / month);
          return `Last purchased ${months} month${months === 1 ? "" : "s"} ago`;
        }

        const years = Math.floor(elapsed / year);
        return `Last purchased ${years} year${years === 1 ? "" : "s"} ago`;
      }

      function syncStageHeight() {
        const activePanel = shell.classList.contains("is-flipped") ? catalogPanel : shoppingPanel;
        flipStage.style.height = `${activePanel.scrollHeight}px`;
      }

      function shoppingItems() {
        const query = shoppingSearch.value.trim().toLowerCase();
        return shoppingOrder
          .map((id) => itemsById.get(id))
          .filter(Boolean)
          .filter((item) => {
            if (!query) {
              return true;
            }

            return (
              item.name.toLowerCase().includes(query) ||
              item.note.toLowerCase().includes(query) ||
              getStoreName(item.preferredStoreId).toLowerCase().includes(query)
            );
          });
      }

      function catalogItems() {
        const query = catalogSearch.value.trim().toLowerCase();
        return catalog.filter((item) => {
          if (!query) {
            return true;
          }

          return (
            item.name.toLowerCase().includes(query) ||
            item.note.toLowerCase().includes(query) ||
            getStoreName(item.preferredStoreId).toLowerCase().includes(query)
          );
        });
      }

      function refreshShoppingButtons() {
        clearShoppingButton.disabled = shoppingOrder.length === 0;
        moveMarkedButton.disabled = !shoppingOrder.some((id) => itemsById.get(id)?.done);
      }

      function storeLabel(item) {
        const preferredStoreName = getStoreName(item.preferredStoreId);
        return preferredStoreName ? `Store: ${preferredStoreName}` : "Store: Any store";
      }

      function sortedStores() {
        return [...stores].sort((a, b) => a.name.localeCompare(b.name));
      }

      function renderStoreList() {
        const fragment = document.createDocumentFragment();

        sortedStores().forEach((store) => {
          const bubble = document.createElement("div");
          bubble.className = "store-circle";
          bubble.title = store.name;
          bubble.setAttribute("aria-label", store.name);
          bubble.textContent = store.name.charAt(0).toUpperCase();
          fragment.append(bubble);
        });

        storeList.replaceChildren(fragment);
        storeForm.hidden = !isStoreFormOpen;
        syncStageHeight();
      }

      function updateShoppingItemElement(item) {
        const parts = shoppingElements.get(item.id);
        if (!parts) {
          return;
        }

        parts.li.classList.toggle("done", item.done);
        parts.button.setAttribute("aria-pressed", String(item.done));
        parts.button.setAttribute(
          "aria-label",
          `${item.done ? "Unmark" : "Mark"} ${item.name} ${item.done ? "as not done" : "done"}`
        );
        parts.toggle.textContent = item.done ? "↺" : "";
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.store.hidden = item.preferredStoreId === null;
        parts.store.textContent = item.preferredStoreId === null ? "" : `Buy at ${getStoreName(item.preferredStoreId)}`;
      }

      function updateCatalogItemElement(item) {
        const parts = catalogElements.get(item.id);
        if (!parts) {
          return;
        }

        const onList = shoppingSet.has(item.id);
        parts.li.classList.toggle("on-list", onList);
        parts.mainButton.setAttribute(
          "aria-label",
          onList ? `Remove ${item.name} from shopping list` : `Add ${item.name} to shopping list`
        );
        parts.shoppingButton.setAttribute(
          "aria-label",
          onList ? `Remove ${item.name} from shopping list` : `Add ${item.name} to shopping list`
        );
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.meta.textContent = formatRelativePurchase(getLastPurchased(item));
        parts.store.textContent = storeLabel(item);
        parts.shoppingButton.textContent = onList ? "Remove" : "Add";

        const storeChoices = document.createDocumentFragment();
        sortedStores().forEach((store) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `store-circle item-store-choice${
            item.preferredStoreId === store.id ? " active" : ""
          }`;
          button.title = `Buy ${item.name} from ${store.name}`;
          button.setAttribute("aria-label", `Buy ${item.name} from ${store.name}`);
          button.textContent = store.name.charAt(0).toUpperCase();
          button.addEventListener("click", () => {
            setPreferredStore(item.id, item.preferredStoreId === store.id ? null : store.id);
          });
          storeChoices.append(button);
        });
        parts.storeChoices.replaceChildren(storeChoices);
      }

      function createShoppingItemElement(item) {
        const li = document.createElement("li");
        li.className = `item shopping-item${item.done ? " done" : ""}`;

        const button = document.createElement("button");
        button.className = "shopping-row";
        button.type = "button";
        button.addEventListener("click", () => {
          const wasDone = item.done;
          item.done = !item.done;

          if (!wasDone && item.done) {
            item.purchaseHistory.push(new Date().toISOString());
            updateCatalogItemElement(item);
            persistState();
          } else if (wasDone && !item.done) {
            persistState();
          }

          updateShoppingItemElement(item);
          refreshShoppingButtons();
        });

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const store = document.createElement("div");
        store.className = "item-meta";

        const toggle = document.createElement("div");
        toggle.className = "toggle";
        toggle.setAttribute("aria-hidden", "true");

        main.append(name, note, store);
        button.append(main, toggle);
        li.append(button);

        shoppingElements.set(item.id, { li, button, note, store, toggle });
        updateShoppingItemElement(item);
      }

      function createCatalogItemElement(item) {
        const li = document.createElement("li");
        li.className = "item catalog-item";

        const card = document.createElement("div");
        card.className = "catalog-card";

        const mainButton = document.createElement("button");
        mainButton.className = "catalog-main";
        mainButton.type = "button";
        mainButton.addEventListener("click", () => {
          toggleShoppingListItem(item.id);
        });

        const actions = document.createElement("div");
        actions.className = "catalog-actions";

        const shoppingButton = document.createElement("button");
        shoppingButton.className = "catalog-action shopping-action";
        shoppingButton.type = "button";
        shoppingButton.addEventListener("click", () => {
          toggleShoppingListItem(item.id);
        });

        const storeChoices = document.createElement("div");
        storeChoices.className = "catalog-store-choices";

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const meta = document.createElement("div");
        meta.className = "item-meta";

        const store = document.createElement("div");
        store.className = "item-meta";

        main.append(name, note, meta, store);
        mainButton.append(main);
        actions.append(shoppingButton, storeChoices);
        card.append(mainButton, actions);
        li.append(card);

        catalogElements.set(item.id, {
          li,
          mainButton,
          shoppingButton,
          note,
          meta,
          store,
          storeChoices
        });
        updateCatalogItemElement(item);
      }

      function refreshCatalogPurchaseLabels() {
        catalog.forEach((item) => {
          updateCatalogItemElement(item);
        });
      }

      function storeGroupKey(storeId) {
        return storeId === null ? "any" : `store-${storeId}`;
      }

      function storeGroupName(storeId) {
        return storeId === null ? "Any Store" : getStoreName(storeId);
      }

      function groupedShoppingItems() {
        const groups = new Map();

        shoppingItems().forEach((item) => {
          const key = storeGroupKey(item.preferredStoreId);
          if (!groups.has(key)) {
            groups.set(key, {
              key,
              storeId: item.preferredStoreId,
              name: storeGroupName(item.preferredStoreId),
              items: []
            });
          }

          groups.get(key).items.push(item);
        });

        return [...groups.values()];
      }

      function moveStoreToTop(storeId) {
        const targetIds = shoppingOrder.filter((id) => itemsById.get(id)?.preferredStoreId === storeId);
        if (targetIds.length === 0) {
          return;
        }

        const targetSet = new Set(targetIds);
        const remainingIds = shoppingOrder.filter((id) => !targetSet.has(id));
        shoppingOrder.splice(0, shoppingOrder.length, ...targetIds, ...remainingIds);
        persistState();
        syncShoppingVisibleList();
      }

      function syncShoppingVisibleList() {
        const groups = groupedShoppingItems();
        const nodes = groups.map((group) => {
          const section = document.createElement("section");
          section.className = `store-group${collapsedGroups.has(group.key) ? " collapsed" : ""}`;

          const header = document.createElement("div");
          header.className = "store-group-header";

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "store-group-toggle";
          toggle.addEventListener("click", () => {
            if (collapsedGroups.has(group.key)) {
              collapsedGroups.delete(group.key);
            } else {
              collapsedGroups.add(group.key);
            }
            syncShoppingVisibleList();
          });

          const title = document.createElement("div");
          title.className = "store-group-title";

          const strong = document.createElement("strong");
          strong.textContent = group.name;

          const count = document.createElement("span");
          count.textContent = `${group.items.length} item${group.items.length === 1 ? "" : "s"}`;

          const chevron = document.createElement("div");
          chevron.className = "store-group-chevron";
          chevron.textContent = collapsedGroups.has(group.key) ? "+" : "-";

          title.append(strong, count);
          toggle.append(title, chevron);

          const moveButton = document.createElement("button");
          moveButton.type = "button";
          moveButton.className = "store-group-icon";
          moveButton.textContent = "↑";
          moveButton.title = `Move ${group.name} to top`;
          moveButton.setAttribute("aria-label", `Move ${group.name} to top`);
          moveButton.addEventListener("click", () => {
            moveStoreToTop(group.storeId);
          });

          header.append(toggle, moveButton);

          const body = document.createElement("div");
          body.className = "store-group-body";

          const items = document.createElement("ul");
          items.className = "store-group-items";
          items.append(...group.items.map((item) => shoppingElements.get(item.id).li));

          body.append(items);
          section.append(header, body);
          return section;
        });

        shoppingList.replaceChildren(...nodes);
        shoppingEmpty.hidden = nodes.length > 0;
        refreshShoppingButtons();
        syncStageHeight();
      }

      function syncCatalogVisibleList() {
        const nodes = catalogItems().map((item) => catalogElements.get(item.id).li);
        catalogList.replaceChildren(...nodes);
        catalogEmpty.hidden = nodes.length > 0;
        syncStageHeight();
      }

      function moveItemToTop(id) {
        const index = shoppingOrder.indexOf(id);
        if (index <= 0) {
          return;
        }

        shoppingOrder.splice(index, 1);
        shoppingOrder.unshift(id);
      }

      function removeFromShoppingList(id) {
        if (!shoppingSet.has(id)) {
          return;
        }

        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;
        shoppingSet.delete(id);

        const index = shoppingOrder.indexOf(id);
        if (index !== -1) {
          shoppingOrder.splice(index, 1);
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
      }

      function setPreferredStore(id, storeId) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.preferredStoreId =
          storeId === null || stores.some((store) => store.id === storeId) ? storeId ?? null : null;
        updateCatalogItemElement(item);
        updateShoppingItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function addToShoppingList(id) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;

        if (shoppingSet.has(id)) {
          moveItemToTop(id);
        } else {
          shoppingSet.add(id);
          shoppingOrder.unshift(id);
          if (!shoppingElements.has(id)) {
            createShoppingItemElement(item);
          }
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function toggleShoppingListItem(id) {
        if (shoppingSet.has(id)) {
          removeFromShoppingList(id);
          syncShoppingVisibleList();
          return;
        }

        addToShoppingList(id);
      }

      function setFlipped(isFlipped) {
        shell.classList.toggle("is-flipped", isFlipped);
        syncStageHeight();
      }

      catalog.forEach((item) => {
        createCatalogItemElement(item);

        if (shoppingSet.has(item.id)) {
          createShoppingItemElement(item);
        }
      });

      renderStoreList();
      syncShoppingVisibleList();
      syncCatalogVisibleList();

      shoppingSearch.addEventListener("input", syncShoppingVisibleList);
      catalogSearch.addEventListener("input", syncCatalogVisibleList);

      showStoreFormButton.addEventListener("click", () => {
        isStoreFormOpen = !isStoreFormOpen;
        renderStoreList();
        if (isStoreFormOpen) {
          newStoreInput.focus();
        }
      });

      storeForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = newStoreInput.value.trim();
        if (!name) {
          return;
        }

        const existingStore = stores.find((store) => store.name.toLowerCase() === name.toLowerCase());
        if (!existingStore) {
          const store = { id: nextStoreId++, name };
          stores.push(store);
        }

        isStoreFormOpen = false;
        renderStoreList();
        refreshCatalogPurchaseLabels();
        persistState();
        newStoreInput.value = "";
      });

      clearShoppingButton.addEventListener("click", () => {
        const hasUnmarkedItems = shoppingOrder.some((id) => !itemsById.get(id).done);
        if (hasUnmarkedItems) {
          const confirmed = window.confirm("Clear the shopping list? You still have unmarked items.");
          if (!confirmed) {
            return;
          }
        }

        shoppingOrder.splice(0, shoppingOrder.length);
        shoppingSet.clear();

        catalog.forEach((item) => {
          item.done = false;
          updateCatalogItemElement(item);
        });

        persistState();
        syncShoppingVisibleList();
      });

      moveMarkedButton.addEventListener("click", () => {
        if (!shoppingOrder.some((id) => itemsById.get(id).done)) {
          return;
        }

        const openItems = shoppingOrder.filter((id) => !itemsById.get(id).done);
        const doneItems = shoppingOrder.filter((id) => itemsById.get(id).done);
        shoppingOrder.splice(0, shoppingOrder.length, ...openItems, ...doneItems);
        persistState();
        syncShoppingVisibleList();
      });

      showCatalogButton.addEventListener("click", () => {
        setFlipped(true);
      });

      showShoppingButton.addEventListener("click", () => {
        setFlipped(false);
      });

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = newItemInput.value.trim();
        if (!name) {
          return;
        }

        const item = {
          id: nextId++,
          name,
          note: "",
          done: false,
          purchaseHistory: [],
          preferredStoreId: null
        };

        catalog.unshift(item);
        itemsById.set(item.id, item);
        createCatalogItemElement(item);
        persistState();
        newItemInput.value = "";
        syncCatalogVisibleList();
        newItemInput.focus();
      });

      window.addEventListener("resize", syncStageHeight);
      window.setInterval(refreshCatalogPurchaseLabels, 60 * 1000);
      syncStageHeight();
    </script>
  </body>
</html>
