<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grocery List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  </head>
  <body>
    <section class="section">
      <div class="container is-max-desktop">
        <div id="shell" class="box">
          <section id="shopping-panel" aria-label="Shopping list">
            <div class="field has-addons mb-5">
              <div class="control is-expanded">
                <input
                  id="shopping-search"
                  class="input is-large"
                  type="search"
                  placeholder="search..."
                  aria-label="Search shopping list"
                />
              </div>
              <div class="control">
                <button id="show-catalog" class="button is-large" type="button" aria-label="All items">⚙</button>
              </div>
            </div>

            <div id="shopping-list" aria-live="polite"></div>
            <article id="shopping-empty" class="message" hidden>
              <div class="message-body">No matching items.</div>
            </article>

            <div class="columns is-mobile mt-5">
              <div class="column">
                <button id="move-marked" class="button is-fullwidth is-large" type="button">Move check items down</button>
              </div>
              <div class="column">
                <button id="clear-shopping" class="button is-fullwidth is-large" type="button">Clear Items</button>
              </div>
            </div>
          </section>

          <section id="catalog-panel" aria-label="All items" hidden>
            <div class="level is-mobile mb-5">
              <div class="level-left">
                <div>
                  <p class="title is-4 mb-1">All Items</p>
                </div>
              </div>
              <div class="level-right">
                <button id="show-shopping" class="button is-large" type="button" aria-label="Shopping list">⌂</button>
              </div>
            </div>

            <div class="tabs is-boxed is-fullwidth mb-4">
              <ul>
                <li id="stores-tab" class="is-active"><a href="#stores" id="stores-tab-link">Stores</a></li>
                <li id="items-tab"><a href="#items" id="items-tab-link">Items</a></li>
              </ul>
            </div>

            <section id="stores-panel">
              <p id="store-count" class="is-size-6 has-text-grey mb-4">0 stores</p>
              <form id="store-form">
                <div class="field has-addons mb-4">
                  <div class="control is-expanded">
                    <input
                      id="new-store"
                      class="input is-large"
                      type="text"
                      placeholder="add store..."
                      aria-label="Add store"
                      list="brand-store-suggestions"
                    />
                  </div>
                  <div class="control">
                    <button class="button is-large" type="submit">Add store</button>
                  </div>
                </div>
              </form>
              <div id="store-list" class="tags are-medium"></div>
              <datalist id="brand-store-suggestions"></datalist>
            </section>

            <section id="items-panel" hidden>
              <p id="catalog-count" class="is-size-6 has-text-grey mb-4">0 items</p>
              <div class="field mb-4">
                <div class="control">
                  <input
                    id="catalog-search"
                    class="input is-large"
                    type="search"
                    placeholder="search..."
                    aria-label="Search all items"
                  />
                </div>
              </div>

              <form id="add-form">
                <div class="field has-addons mb-4">
                  <div class="control is-expanded">
                    <input id="new-item" class="input is-large" type="text" placeholder="add item..." aria-label="Add item" />
                  </div>
                  <div class="control">
                    <button class="button is-large" type="submit">Add</button>
                  </div>
                </div>
              </form>

              <div id="catalog-list"></div>
              <article id="catalog-empty" class="message" hidden>
                <div class="message-body">No matching items.</div>
              </article>
            </section>
          </section>
        </div>
      </div>
    </section>

      const groceryBrandByKey = new Map(TOP_GROCERY_BRANDS.map((brand) => [brand.key, brand]));
      const normalizedBrandIndex = TOP_GROCERY_BRANDS.map((brand) => ({
        ...brand,
        normalizedName: brand.name.toLowerCase().replace(/[^a-z0-9]+/g, "")
      }));

      function safeReadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return JSON.parse(raw);
          }

          const legacyRaw = window.localStorage.getItem(LEGACY_STORAGE_KEY);
          return legacyRaw ? JSON.parse(legacyRaw) : null;
        } catch (error) {
          return null;
        }
      }

      function normalizeStoreIds(storeIds) {
        return [...new Set(storeIds.map(Number).filter((id) => !Number.isNaN(id)))];
      }

      function normalizeItem(item) {
        const selectedStoreIds = Array.isArray(item.selectedStoreIds)
          ? normalizeStoreIds(item.selectedStoreIds)
          : item.preferredStoreId === null || item.preferredStoreId === undefined
            ? []
            : Number.isNaN(Number(item.preferredStoreId))
              ? []
              : [Number(item.preferredStoreId)];

        return {
          id: Number(item.id),
          name: String(item.name || "").trim(),
          note: String(item.note || "").trim(),
          done: Boolean(item.done),
          purchaseHistory: Array.isArray(item.purchaseHistory)
            ? item.purchaseHistory.filter((entry) => !Number.isNaN(Date.parse(entry)))
            : [],
          selectedStoreIds
        };
      }

      function normalizeStore(store) {
        const inferredBrand = inferStoreBrand(store.name || "");
        return {
          id: Number(store.id),
          name: String(store.name || "").trim(),
          brandKey:
            typeof store.brandKey === "string" && groceryBrandByKey.has(store.brandKey)
              ? store.brandKey
              : inferredBrand?.key || null
        };
      }

      function normalizeStoreName(name) {
        return String(name || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function inferStoreBrand(name) {
        const normalizedInput = normalizeStoreName(name);
        if (!normalizedInput) {
          return null;
        }

        const exact = normalizedBrandIndex.find((brand) => brand.normalizedName === normalizedInput);
        if (exact) {
          return exact;
        }

        const rankedMatches = normalizedBrandIndex
          .map((brand) => {
            let score = 0;

            if (brand.normalizedName.startsWith(normalizedInput)) {
              score += 4;
            }

            if (normalizedInput.startsWith(brand.normalizedName)) {
              score += 3;
            }

            if (brand.normalizedName.includes(normalizedInput) || normalizedInput.includes(brand.normalizedName)) {
              score += 2;
            }

            return { brand, score };
          })
          .filter((entry) => entry.score > 0)
          .sort((a, b) => b.score - a.score || a.brand.name.length - b.brand.name.length);

        return rankedMatches[0]?.brand || null;
      }

      function buildInitialState() {
        const saved = safeReadState();
        const savedCatalog = Array.isArray(saved?.catalog) ? saved.catalog.map(normalizeItem) : null;

        const savedStores = Array.isArray(saved?.stores) ? saved.stores.map(normalizeStore) : null;
        const stores = savedStores
          ? savedStores.filter((store) => store.name)
          : seedStores.map(normalizeStore);
        const validStoreIds = new Set(stores.map((store) => store.id));
        catalog.forEach((item) => {
          item.selectedStoreIds = item.selectedStoreIds.filter((storeId) => validStoreIds.has(storeId));
        });
        const validIds = new Set(catalog.map((item) => item.id));
        const savedOrder = Array.isArray(saved?.shoppingOrder)
          ? saved.shoppingOrder.map(Number).filter((id) => validIds.has(id))
          : [];

          ? savedOrder
          : seedShoppingOrder.filter((id) => validIds.has(id));
        const nextId = Math.max(0, ...catalog.map((item) => item.id)) + 1;
        const nextStoreId = Math.max(0, ...stores.map((store) => store.id)) + 1;

        return { catalog, shoppingOrder, stores, nextId, nextStoreId };
      }

        return typeof field?.value === "string" ? field.value : "";
      }

        return item.purchaseHistory[item.purchaseHistory.length - 1] || null;

        if (storeId === null || storeId === undefined) {
          return "";

        return stores.find((store) => store.id === storeId)?.name || "";
      }

      function getStoreById(storeId) {

      function getItemStoreIds(item) {
        return Array.isArray(item.selectedStoreIds) ? item.selectedStoreIds : [];
      }

        return getItemStores(item)[0]?.id ?? null;
      }

        const storeIdSet = new Set(getItemStoreIds(item));
        return sortedStores().filter((store) => storeIdSet.has(store.id));
      }

        return getItemStores(item).map((store) => store.name);

        if (!store?.brandKey) {
          return null;
        }

        return groceryBrandByKey.get(store.brandKey) || null;

        const suggestions = document.getElementById("brand-store-suggestions");
        if (!suggestions) {
          return;
        }

        const optionNodes = TOP_GROCERY_BRANDS
          .map((brand) => brand.name)
          .sort((a, b) => a.localeCompare(b))
          .map((name) => {
            const option = document.createElement("option");
            option.value = name;
            return option;
          });

        suggestions.replaceChildren(...optionNodes);

      function formatRelativePurchase(dateString) {
        if (!dateString) {
          return "Never purchased";
        }

        const timestamp = Date.parse(dateString);
        if (Number.isNaN(timestamp)) {
          return "Never purchased";
        }

        const elapsed = Date.now() - timestamp;
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const week = 7 * day;
        const month = 30 * day;
        const year = 365 * day;

        if (elapsed < minute) {
          return "Last purchased just now";
        }

        if (elapsed < hour) {
          const minutes = Math.floor(elapsed / minute);
          return `Last purchased ${minutes} minute${minutes === 1 ? "" : "s"} ago`;
        }

        if (elapsed < day) {
          const hours = Math.floor(elapsed / hour);
          return `Last purchased ${hours} hour${hours === 1 ? "" : "s"} ago`;
        }

        if (elapsed < week) {
          const days = Math.floor(elapsed / day);
          return `Last purchased ${days} day${days === 1 ? "" : "s"} ago`;
        }

        if (elapsed < month) {
          const weeks = Math.floor(elapsed / week);
          return `Last purchased ${weeks} week${weeks === 1 ? "" : "s"} ago`;
        }

        if (elapsed < year) {
          const months = Math.floor(elapsed / month);
          return `Last purchased ${months} month${months === 1 ? "" : "s"} ago`;
        }

        const years = Math.floor(elapsed / year);
        return `Last purchased ${years} year${years === 1 ? "" : "s"} ago`;
      }

      function syncStageHeight() {}

      function shoppingItems() {
        const query = getFieldValue(shoppingSearch).trim().toLowerCase();
        return shoppingOrder
          .map((id) => itemsById.get(id))
          .filter(Boolean)
          .filter((item) => {
            if (!query) {
              return true;
            }

            return (
              item.name.toLowerCase().includes(query) ||
              item.note.toLowerCase().includes(query) ||
              getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
            );
          });
      }

      function catalogItems() {
        const query = getFieldValue(catalogSearch).trim().toLowerCase();
        return catalog.filter((item) => {
          if (!query) {
            return true;
          }

          return (
            item.name.toLowerCase().includes(query) ||
            item.note.toLowerCase().includes(query) ||
            getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
          );
        });
      }

      function refreshShoppingButtons() {
        clearShoppingButton.disabled = shoppingOrder.length === 0;
        moveMarkedButton.disabled = !shoppingOrder.some((id) => itemsById.get(id)?.done);
      }

      function sortedStores() {
        return [...stores].sort((a, b) => a.name.localeCompare(b.name));
      }

      function renderStoreList() {
        const fragment = document.createDocumentFragment();

        sortedStores().forEach((store) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "button is-light is-medium mr-2 mb-2";
          button.title = `Remove ${store.name}`;
          button.setAttribute("aria-label", `Remove ${store.name}`);
          button.textContent = store.name;
          button.addEventListener("click", () => {
            removeStore(store.id);
          });
          applyStoreCircleStyle(button, store);
          fragment.append(button);
        });

        storeList.replaceChildren(fragment);
        storeCount.textContent = `${stores.length} store${stores.length === 1 ? "" : "s"}`;
      }

      function renderCatalogSection() {
        catalogCount.textContent = `${catalog.length} item${catalog.length === 1 ? "" : "s"}`;
      }

      function setCatalogTab(nextTab) {
        activeCatalogTab = nextTab === "stores" ? "stores" : "items";
        storesTab.classList.toggle("is-active", activeCatalogTab === "stores");
        itemsTab.classList.toggle("is-active", activeCatalogTab === "items");
        storesPanel.hidden = activeCatalogTab !== "stores";
        itemsPanel.hidden = activeCatalogTab !== "items";
      }

      function updateShoppingItemElement(item) {
        const parts = shoppingElements.get(item.id);
        if (!parts) {
          return;
        }

        const primaryStoreId = getPrimaryStoreId(item);

        parts.button.setAttribute("aria-pressed", String(item.done));
        parts.button.setAttribute(
          "aria-label",
          `${item.done ? "Unmark" : "Mark"} ${item.name} ${item.done ? "as not done" : "done"}`
        );
        parts.card.classList.toggle("has-background-light", item.done);
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.store.hidden = primaryStoreId === null;
        parts.store.textContent = primaryStoreId === null ? "" : `Buy at ${getStoreName(primaryStoreId)}`;
        parts.status.hidden = !item.done;
      }

      function updateCatalogItemElement(item) {
        const parts = catalogElements.get(item.id);
        if (!parts) {
          return;
        }

        const onList = shoppingSet.has(item.id);
        parts.mainButton.setAttribute(
          "aria-label",
          onList ? `Remove ${item.name} from shopping list` : `Add ${item.name} to shopping list`
        );
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.meta.textContent = formatRelativePurchase(getLastPurchased(item));
        parts.state.className = `tag is-medium ${onList ? "is-info" : "is-light"}`;
        parts.state.textContent = onList ? "On list" : "Add to list";
        parts.storeButton.textContent = "Stores";
        parts.storeButton.title = `Choose stores for ${item.name}`;
        parts.storeDropdown.classList.toggle("is-active", openStoreMenuItemId === item.id && stores.length > 0);

        const chips = document.createDocumentFragment();
        getItemStores(item).forEach((store) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "button is-small is-light mr-2 mb-2";
          chip.title = `Remove ${store.name} from ${item.name}`;
          chip.setAttribute("aria-label", `Remove ${store.name} from ${item.name}`);
          chip.textContent = store.name;
          chip.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleItemStoreSelection(item.id, store.id);
          });
          applyStoreCircleStyle(chip, store);
          chips.append(chip);
        });
        parts.storeChips.replaceChildren(chips);

        const menuOptions = document.createDocumentFragment();
        sortedStores().forEach((store) => {
          const option = document.createElement("button");
          option.type = "button";
          option.className = `dropdown-item${getItemStoreIds(item).includes(store.id) ? " is-active" : ""}`;
          option.setAttribute("aria-pressed", String(getItemStoreIds(item).includes(store.id)));
          option.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleItemStoreSelection(item.id, store.id);
          });
          option.textContent = `${getItemStoreIds(item).includes(store.id) ? "✓ " : ""}${store.name}`;
          menuOptions.append(option);
        });
        parts.storeMenuContent.replaceChildren(menuOptions);
      }

      function createShoppingItemElement(item) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "box p-5 mb-4 has-text-left";
        card.style.width = "100%";
        card.addEventListener("click", () => {
          const wasDone = item.done;
          item.done = !item.done;

          if (!wasDone && item.done) {
            item.purchaseHistory.push(new Date().toISOString());
            updateCatalogItemElement(item);
            persistState();
          } else if (wasDone && !item.done) {
            persistState();
          }

          updateShoppingItemElement(item);
          refreshShoppingButtons();
        });

        const row = document.createElement("div");
        row.className = "is-flex is-justify-content-space-between is-align-items-center";

        const main = document.createElement("div");
        main.className = "pr-4";

        const name = document.createElement("p");
        name.className = "title is-2 mb-3 has-text-left";
        name.textContent = item.name;

        const note = document.createElement("p");
        note.className = "subtitle is-4 mb-2 has-text-left";

        const store = document.createElement("p");
        store.className = "is-size-4 has-text-grey has-text-left";

        const status = document.createElement("span");
        status.className = "tag is-large is-success";
        status.textContent = "Done";

        main.append(name, note, store);
        row.append(main, status);
        card.append(row);

        shoppingElements.set(item.id, { card, button: card, note, store, status });
        updateShoppingItemElement(item);
      }

      function createCatalogItemElement(item) {
        const card = document.createElement("article");
        card.className = "card mb-4";

        const cardContent = document.createElement("div");
        cardContent.className = "card-content";

        const mainButton = document.createElement("button");
        mainButton.className = "button is-white p-0 has-text-left";
        mainButton.type = "button";
        mainButton.style.width = "100%";
        mainButton.addEventListener("click", () => {
          toggleShoppingListItem(item.id);
        });

        const main = document.createElement("div");
        main.className = "has-text-left";

        const name = document.createElement("p");
        name.className = "title is-3 mb-3";
        name.textContent = item.name;

        const note = document.createElement("p");
        note.className = "subtitle is-5 mb-2";

        const meta = document.createElement("p");
        meta.className = "is-size-6 has-text-grey";

        const footer = document.createElement("div");
        footer.className = "is-flex is-justify-content-space-between is-align-items-flex-start is-flex-wrap-wrap mt-4";

        const state = document.createElement("span");
        state.className = "tag is-medium";

        const storeTools = document.createElement("div");
        storeTools.className = "is-flex is-align-items-flex-start is-flex-wrap-wrap is-justify-content-flex-end";

        const storeChips = document.createElement("div");
        storeChips.className = "buttons are-small mb-0 mr-2";

        const storeDropdown = document.createElement("div");
        storeDropdown.className = "dropdown is-right";

        const storeTrigger = document.createElement("div");
        storeTrigger.className = "dropdown-trigger";

        const storeButton = document.createElement("button");
        storeButton.className = "button is-small";
        storeButton.type = "button";
        storeButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (stores.length === 0) {
            setCatalogTab("stores");
            newStoreInput.focus();
            return;
          }

          setOpenStoreMenu(openStoreMenuItemId === item.id ? null : item.id);
        });

        const storeMenu = document.createElement("div");
        storeMenu.className = "dropdown-menu";
        storeMenu.setAttribute("role", "menu");

        const storeMenuContent = document.createElement("div");
        storeMenuContent.className = "dropdown-content";
        storeMenuContent.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        storeTrigger.append(storeButton);
        storeMenu.append(storeMenuContent);
        storeDropdown.append(storeTrigger, storeMenu);
        storeTools.append(storeChips, storeDropdown);
        footer.append(state, storeTools);
        main.append(name, note, meta);
        mainButton.append(main);
        cardContent.append(mainButton, footer);
        card.append(cardContent);

        catalogElements.set(item.id, {
          card,
          mainButton,
          note,
          meta,
          state,
          storeChips,
          storeDropdown,
          storeButton,
          storeMenuContent
        });
        updateCatalogItemElement(item);
      }

      function refreshCatalogPurchaseLabels() {
        catalog.forEach((item) => {
          updateCatalogItemElement(item);
        });
      }

      function storeGroupKey(storeId) {
        return storeId === null ? "any" : `store-${storeId}`;
      }

      function storeGroupName(storeId) {
        return storeId === null ? "Any Store" : getStoreName(storeId);
      }

      function groupedShoppingItems() {
        const groups = new Map();

        shoppingItems().forEach((item) => {
          const primaryStoreId = getPrimaryStoreId(item);
          const key = storeGroupKey(primaryStoreId);
          if (!groups.has(key)) {
            groups.set(key, {
              key,
              storeId: primaryStoreId,
              name: storeGroupName(primaryStoreId),
              items: []
            });
          }

          groups.get(key).items.push(item);
        });

        return [...groups.values()];
      }

      function moveStoreToTop(storeId) {
        const targetIds = shoppingOrder.filter((id) => getPrimaryStoreId(itemsById.get(id)) === storeId);
        if (targetIds.length === 0) {
          return;
        }

        const targetSet = new Set(targetIds);
        const remainingIds = shoppingOrder.filter((id) => !targetSet.has(id));
        shoppingOrder.splice(0, shoppingOrder.length, ...targetIds, ...remainingIds);
        persistState();
        syncShoppingVisibleList();
      }

      function syncShoppingVisibleList() {
        const groups = groupedShoppingItems();
        const nodes = groups.map((group) => {
          const section = document.createElement("article");
          section.className = "card mb-5";

          const header = document.createElement("header");
          header.className = "card-header";

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "card-header-title";
          toggle.addEventListener("click", () => {
            if (collapsedGroups.has(group.key)) {
              collapsedGroups.delete(group.key);
            } else {
              collapsedGroups.add(group.key);
            }
            syncShoppingVisibleList();
          });

          const strong = document.createElement("strong");
          strong.textContent = group.name;

          const count = document.createElement("span");
          count.className = "ml-3 has-text-grey";
          count.textContent = `${group.items.length} item${group.items.length === 1 ? "" : "s"}`;

          const chevron = document.createElement("span");
          chevron.className = "ml-auto";
          chevron.textContent = collapsedGroups.has(group.key) ? "+" : "-";

          toggle.append(strong, count, chevron);

          const moveButton = document.createElement("button");
          moveButton.type = "button";
          moveButton.className = "card-header-icon";
          moveButton.textContent = "↑";
          moveButton.title = `Move ${group.name} to top`;
          moveButton.setAttribute("aria-label", `Move ${group.name} to top`);
          moveButton.addEventListener("click", () => {
            moveStoreToTop(group.storeId);
          });

          header.append(toggle, moveButton);

          const body = document.createElement("div");
          body.className = "card-content";
          body.hidden = collapsedGroups.has(group.key);

          const items = document.createElement("div");
          items.append(...group.items.map((item) => shoppingElements.get(item.id).card));

          body.append(items);
          section.append(header, body);
          return section;
        });

        shoppingList.replaceChildren(...nodes);
        shoppingEmpty.hidden = nodes.length > 0;
        refreshShoppingButtons();
        syncStageHeight();
      }

      function syncCatalogVisibleList() {
        const nodes = catalogItems().map((item) => catalogElements.get(item.id).card);
        catalogList.replaceChildren(...nodes);
        catalogEmpty.hidden = nodes.length > 0;
      }

      function moveItemToTop(id) {
        const index = shoppingOrder.indexOf(id);
        if (index <= 0) {
          return;
        }

        shoppingOrder.splice(index, 1);
        shoppingOrder.unshift(id);
      }

      function removeFromShoppingList(id) {
        if (!shoppingSet.has(id)) {
          return;
        }

        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;
        shoppingSet.delete(id);

        const index = shoppingOrder.indexOf(id);
        if (index !== -1) {
          shoppingOrder.splice(index, 1);
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
      }

      function setOpenStoreMenu(itemId) {
        const previousId = openStoreMenuItemId;
        openStoreMenuItemId = itemId;

        if (previousId !== null) {
          const previousItem = itemsById.get(previousId);
          if (previousItem) {
            updateCatalogItemElement(previousItem);
          }
        }

        if (itemId !== null && itemId !== previousId) {
          const currentItem = itemsById.get(itemId);
          if (currentItem) {
            updateCatalogItemElement(currentItem);
          }
        }

      }

      function removeStore(storeId) {
        const index = stores.findIndex((store) => store.id === storeId);
        if (index === -1) {
          return;
        }

        stores.splice(index, 1);
        catalog.forEach((item) => {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
          updateCatalogItemElement(item);
          updateShoppingItemElement(item);
        });

        if (stores.length === 0) {
          setCatalogTab("stores");
        }
        setOpenStoreMenu(null);
        renderStoreList();
        persistState();
        syncShoppingVisibleList();
      }

      function toggleItemStoreSelection(id, storeId) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        if (!stores.some((store) => store.id === storeId)) {
          return;
        }

        if (getItemStoreIds(item).includes(storeId)) {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
        } else {
          item.selectedStoreIds = [...getItemStoreIds(item), storeId];
        }

        updateCatalogItemElement(item);
        updateShoppingItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function addToShoppingList(id) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;

        if (shoppingSet.has(id)) {
          moveItemToTop(id);
        } else {
          shoppingSet.add(id);
          shoppingOrder.unshift(id);
          if (!shoppingElements.has(id)) {
            createShoppingItemElement(item);
          }
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function toggleShoppingListItem(id) {
        if (shoppingSet.has(id)) {
          removeFromShoppingList(id);
          syncShoppingVisibleList();
          return;
        }

        addToShoppingList(id);
      }

      function isCatalogHash(hash) {
        return hash === CATALOG_HASH || hash === "#all-items";
      }

      function isShoppingHash(hash) {
        return hash === SHOPPING_HASH || hash === "#shopping-list";
      }

      function syncPanelFromLocation() {
        const currentHash = window.location.hash;
        setFlipped(isCatalogHash(currentHash), false);
        const normalizedHash = isCatalogHash(currentHash) ? CATALOG_HASH : SHOPPING_HASH;
        if (currentHash !== normalizedHash) {
          window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${normalizedHash}`);
        }
      }

      function navigateToPanel(isFlipped) {
        const nextHash = isFlipped ? CATALOG_HASH : SHOPPING_HASH;
        if (window.location.hash === nextHash) {
          setFlipped(isFlipped, false);
          return;
        }

        window.location.hash = nextHash;
      }

      function setFlipped(isFlipped, updateUrl = true) {
        setOpenStoreMenu(null);
        shoppingPanel.hidden = isFlipped;
        catalogPanel.hidden = !isFlipped;
        if (updateUrl) {
          navigateToPanel(isFlipped);
          return;
        }
      }

      catalog.forEach((item) => {
        createCatalogItemElement(item);

        if (shoppingSet.has(item.id)) {
          createShoppingItemElement(item);
        }
      });

      renderStoreSuggestions();
      renderStoreList();
      renderCatalogSection();
      syncShoppingVisibleList();
      syncCatalogVisibleList();
      setCatalogTab(activeCatalogTab);
      if (!isCatalogHash(window.location.hash) && !isShoppingHash(window.location.hash)) {
        window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${SHOPPING_HASH}`);
      }
      syncPanelFromLocation();

      shoppingSearch.addEventListener("input", syncShoppingVisibleList);
      catalogSearch.addEventListener("input", syncCatalogVisibleList);
      window.addEventListener("hashchange", syncPanelFromLocation);
      document.addEventListener("click", () => {
        if (openStoreMenuItemId !== null) {
          setOpenStoreMenu(null);
        }
      });

      storesTabLink.addEventListener("click", (event) => {
        event.preventDefault();
        setCatalogTab("stores");
      });

      itemsTabLink.addEventListener("click", (event) => {
        event.preventDefault();
        setCatalogTab("items");
      });

      storeForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const rawName = getFieldValue(newStoreInput).trim();
        if (!rawName) {
          return;
        }

        const matchedBrand = inferStoreBrand(rawName);
        const resolvedName = matchedBrand?.name || rawName;

        const existingStore = stores.find((store) => {
          if (matchedBrand && store.brandKey === matchedBrand.key) {
            return true;
          }

          return store.name.toLowerCase() === resolvedName.toLowerCase();
        });
        if (!existingStore) {
          const store = {
            id: nextStoreId++,
            name: resolvedName,
            brandKey: matchedBrand?.key || null
          };
          stores.push(store);
        }

        setCatalogTab("stores");
        renderStoreList();
        refreshCatalogPurchaseLabels();
        persistState();
        newStoreInput.value = "";
        newStoreInput.focus();
      });

      clearShoppingButton.addEventListener("click", () => {
        const hasUnmarkedItems = shoppingOrder.some((id) => !itemsById.get(id).done);
        if (hasUnmarkedItems) {
          const confirmed = window.confirm("Clear the shopping list? You still have unmarked items.");
          if (!confirmed) {
            return;
          }
        }

        shoppingOrder.splice(0, shoppingOrder.length);
        shoppingSet.clear();

        catalog.forEach((item) => {
          item.done = false;
          updateCatalogItemElement(item);
        });

        persistState();
        syncShoppingVisibleList();
      });

      moveMarkedButton.addEventListener("click", () => {
        if (!shoppingOrder.some((id) => itemsById.get(id).done)) {
          return;
        }

        const openItems = shoppingOrder.filter((id) => !itemsById.get(id).done);
        const doneItems = shoppingOrder.filter((id) => itemsById.get(id).done);
        shoppingOrder.splice(0, shoppingOrder.length, ...openItems, ...doneItems);
        persistState();
        syncShoppingVisibleList();
      });

      showCatalogButton.addEventListener("click", () => {
        setFlipped(true);
      });

      showShoppingButton.addEventListener("click", () => {
        setFlipped(false);
      });

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = getFieldValue(newItemInput).trim();
        if (!name) {
          return;
        }

        const item = {
          id: nextId++,
          name,
          note: "",
          done: false,
          purchaseHistory: [],
          selectedStoreIds: []
        };

        catalog.unshift(item);
        itemsById.set(item.id, item);
        createCatalogItemElement(item);
        persistState();
        renderCatalogSection();
        setCatalogTab("items");
        newItemInput.value = "";
        syncCatalogVisibleList();
        newItemInput.focus();
      });

      window.addEventListener("resize", syncStageHeight);
      window.setInterval(refreshCatalogPurchaseLabels, 60 * 1000);
    </script>
  </body>
</html>
