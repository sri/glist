<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grocery List</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f0e3;
        --bg-accent: #efe0ba;
        --panel: rgba(255, 251, 244, 0.92);
        --panel-strong: #fff7eb;
        --panel-soft: rgba(255, 255, 255, 0.68);
        --ink: #263127;
        --muted: #617060;
        --fresh: #296347;
        --fresh-soft: rgba(41, 99, 71, 0.12);
        --warm: #d96f32;
        --warm-soft: rgba(217, 111, 50, 0.14);
        --done: #8f978d;
        --shadow: 0 24px 50px rgba(78, 60, 32, 0.16);
        --blob-top: rgba(124, 184, 116, 0.22);
        --blob-bottom: rgba(255, 190, 118, 0.22);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 18px;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Avenir Next Rounded", "Nunito", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.65), transparent 30%),
          radial-gradient(circle at bottom left, rgba(217, 111, 50, 0.18), transparent 28%),
          linear-gradient(160deg, var(--bg) 0%, #f2ebd9 50%, var(--bg-accent) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        pointer-events: none;
        border-radius: 999px;
        filter: blur(10px);
        opacity: 0.45;
      }

      body::before {
        width: 220px;
        height: 220px;
        top: -60px;
        right: -40px;
        background: var(--blob-top);
      }

      body::after {
        width: 280px;
        height: 280px;
        left: -120px;
        bottom: 8vh;
        background: var(--blob-bottom);
      }

      .app {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }

      .shell {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 34px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .flip-stage {
        display: block;
      }

      .flip-card {
        display: block;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 20px;
      }

      .panel-back {
        transform: none;
      }

      .panel-header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 16px 0;
      }

      .panel-nav {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .nav-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--fresh-soft);
        color: var(--fresh);
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-btn:active {
        transform: scale(0.985);
      }

      .nav-btn:not(:disabled):hover {
        transform: translateY(-1px);
      }

      .panel-search {
        width: 100%;
      }

      .tab-bar {
        display: flex;
        gap: 8px;
        padding: 0 16px;
      }

      .tab-btn {
        flex: 1;
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: var(--radius-lg);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 150ms ease, color 150ms ease, transform 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .tab-btn:active {
        transform: scale(0.985);
      }

      .tab-btn.active {
        background: var(--panel-soft);
        color: var(--ink);
        box-shadow: 0 8px 20px rgba(90, 72, 40, 0.06);
      }

      .tab-btn:not(.active):hover {
        background: rgba(98, 112, 96, 0.06);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: grid;
        gap: 10px;
      }

      .search-wrap {
        padding: 0 16px;
      }

      .bottom-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding: 0 16px;
      }

      .bottom-actions .action-btn {
        width: 100%;
        min-height: 72px;
        border-radius: var(--radius-lg);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        font-size: 1rem;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-radius: var(--radius-xl);
        background: var(--panel-strong);
        border: 1px solid rgba(68, 81, 66, 0.08);
        box-shadow: 0 14px 28px rgba(90, 72, 40, 0.08);
      }

      .search-box input,
      .add-form input,
      .store-form input {
        width: 100%;
        border: 0;
        outline: 0;
        padding: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 1.08rem;
      }

      .search-box input::placeholder,
      .add-form input::placeholder,
      .store-form input::placeholder {
        color: #7c8677;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 16px;
      }

      .action-btn {
        min-height: 44px;
        padding: 10px 15px;
        border: 0;
        border-radius: 999px;
        background: var(--warm-soft);
        color: var(--warm);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, opacity 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .action-btn.alt {
        background: var(--fresh-soft);
        color: var(--fresh);
      }

      .action-btn:active {
        transform: scale(0.985);
      }

      .action-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .action-btn:not(:disabled):hover {
        transform: translateY(-1px);
      }

      .add-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 0 16px;
      }

      .store-section {
        display: grid;
        gap: 10px;
        padding: 0 16px;
      }

      .catalog-section {
        display: grid;
        gap: 10px;
        padding: 0 16px;
      }

      .catalog-section-toggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border: 0;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .catalog-section-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .catalog-section-title strong {
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .catalog-section-title span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .catalog-section-chevron {
        font-size: 1rem;
        color: var(--muted);
      }

      .catalog-section-body {
        display: grid;
        gap: 10px;
      }

      .catalog-section.collapsed .catalog-section-body {
        display: none;
      }

      .store-section-toggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border: 0;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .store-section-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .store-section-title strong {
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .store-section-title span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .store-section-chevron {
        font-size: 1rem;
        color: var(--muted);
      }

      .store-section-body {
        display: grid;
        gap: 10px;
      }

      .store-section.collapsed .store-section-body {
        display: none;
      }

      .store-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .store-list {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .store-circle {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .store-circle.active {
        box-shadow: 0 0 0 3px rgba(217, 111, 50, 0.32);
      }

      .store-circle.add-circle {
        background: var(--warm-soft);
        color: var(--warm);
      }

      .store-circle:active {
        transform: scale(0.985);
      }

      .store-pill {
        width: auto;
        min-width: 42px;
        padding: 0 14px;
        border-radius: 999px;
      }

      .store-form[hidden] {
        display: none;
      }

      .store-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 0 16px;
      }

      .store-tab-desc {
        margin: 0;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .store-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .store-suggestion {
        padding: 10px 16px;
        border: 0;
        border-radius: 999px;
        background: var(--panel-soft);
        color: var(--ink);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .store-suggestion:active {
        transform: scale(0.985);
      }

      .store-suggestion:hover {
        background: var(--fresh-soft);
        color: var(--fresh);
      }

      .store-suggestion:focus-visible {
        outline: 3px solid rgba(41, 99, 71, 0.24);
        outline-offset: 3px;
      }

      .quick-add-section {
        display: grid;
        gap: 10px;
      }

      .quick-add-suggestions {
        display: grid;
        gap: 8px;
        padding: 0 16px;
      }

      .quick-add-suggestions:empty {
        display: none;
      }

      .quick-add-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 0;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .quick-add-item:active {
        transform: scale(0.985);
      }

      .quick-add-item:hover {
        background: var(--fresh-soft);
      }

      .quick-add-item:focus-visible {
        outline: 3px solid rgba(41, 99, 71, 0.24);
        outline-offset: 3px;
      }

      .quick-add-item-info {
        flex: 1;
        min-width: 0;
      }

      .quick-add-item-name {
        font-weight: 700;
        font-size: 1.05rem;
      }

      .quick-add-item-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .quick-add-item-stores {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .quick-add-item.on-list {
        opacity: 0.5;
      }

      .quick-add-item.on-list .quick-add-item-name::after {
        content: " (on list)";
        font-weight: 400;
        color: var(--muted);
      }

      .quick-add-new {
        background: var(--warm-soft);
        color: var(--warm);
      }

      .quick-add-new:hover {
        background: var(--warm-soft);
        filter: brightness(0.95);
      }

      .quick-add-new .store-circle {
        opacity: 0.4;
        transition: opacity 150ms ease, transform 150ms ease;
      }

      .quick-add-new .store-circle:hover {
        opacity: 0.7;
      }

      .quick-add-new .store-circle.selected {
        opacity: 1;
        box-shadow: 0 0 0 3px var(--warm);
      }

      .add-field {
        display: flex;
        align-items: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: var(--radius-xl);
        background: var(--panel-strong);
        border: 1px solid rgba(68, 81, 66, 0.08);
        box-shadow: 0 14px 28px rgba(90, 72, 40, 0.08);
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0 16px;
      }

      .item {
        margin-bottom: 12px;
      }

      .shopping-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 18px 18px 18px 20px;
        border: 0;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        color: inherit;
        text-align: left;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .shopping-row:active,
      .catalog-card:active {
        transform: scale(0.985);
      }

      .shopping-row:focus-visible,
      .catalog-card:focus-visible,
      .catalog-section-toggle:focus-visible,
      .store-circle:focus-visible,
      .store-section-toggle:focus-visible,
      .store-group-icon:focus-visible,
      .action-btn:focus-visible,
      .nav-btn:focus-visible,
      .tab-btn:focus-visible {
        outline: 3px solid rgba(41, 99, 71, 0.24);
        outline-offset: 3px;
      }

      .shopping-item:not(.done) .shopping-row:hover,
      .catalog-card:hover,
      .catalog-section-toggle:hover,
      .store-section-toggle:hover,
      .store-circle:hover,
      .store-group-icon:hover {
        transform: translateY(-1px);
      }

      .item-main {
        display: grid;
        gap: 6px;
      }

      .item-name {
        font-size: 1.3rem;
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .item-note {
        font-size: 0.92rem;
        color: var(--muted);
      }

      .item-meta {
        font-size: 0.82rem;
        color: var(--muted);
        opacity: 0.92;
      }

      .catalog-card {
        width: 100%;
        display: grid;
        gap: 10px;
        padding: 18px 18px 18px 20px;
        border-radius: var(--radius-lg);
        background: var(--panel-soft);
        border: 1px solid rgba(68, 81, 66, 0.08);
        box-shadow: 0 12px 26px rgba(90, 72, 40, 0.08);
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .catalog-main {
        display: block;
      }

      .catalog-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .catalog-store-tools {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-left: auto;
        flex-wrap: wrap;
        position: relative;
      }

      .catalog-item.menu-open {
        z-index: 50;
        position: relative;
      }

      .catalog-store-chips {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        flex-wrap: wrap;
      }

      .catalog-store-chip {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .catalog-state {
        min-height: 34px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .catalog-state.off {
        background: rgba(98, 112, 96, 0.08);
        color: var(--muted);
      }

      .catalog-store-button {
        max-width: 100%;
        min-height: 38px;
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        background: rgba(217, 111, 50, 0.14);
        color: var(--warm);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .catalog-store-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 190px;
        display: grid;
        gap: 8px;
        padding: 10px;
        border-radius: 20px;
        background: var(--panel-strong);
        border: 1px solid rgba(68, 81, 66, 0.12);
        box-shadow: 0 18px 32px rgba(90, 72, 40, 0.16);
        z-index: 100;
      }

      .catalog-store-menu[hidden] {
        display: none;
      }

      .catalog-store-option {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 0;
        border-radius: 16px;
        background: rgba(98, 112, 96, 0.08);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .catalog-store-option:active {
        transform: scale(0.985);
      }

      .catalog-store-option:hover {
        transform: translateY(-1px);
      }

      .catalog-store-option.active {
        background: rgba(217, 111, 50, 0.14);
        color: var(--warm);
      }

      .catalog-store-option-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .shopping-groups {
        display: grid;
        gap: 14px;
        padding: 0 16px;
      }

      .store-group {
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(68, 81, 66, 0.08);
        overflow: hidden;
      }

      .store-group-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px 0;
      }

      .store-group-toggle {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 4px 4px 12px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .store-group-icon {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(41, 99, 71, 0.1);
        color: var(--fresh);
        font: inherit;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease, color 150ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .store-group-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .store-group-title strong {
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .store-group-title span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .store-group-chevron {
        font-size: 1rem;
        color: var(--muted);
      }

      .store-group.all-done .store-group-chevron {
        color: var(--fresh);
        font-weight: 700;
      }

      .store-group.all-done .store-group-title strong {
        color: var(--done);
        text-decoration: line-through;
      }

      .store-group.all-done .store-group-title span {
        color: var(--fresh);
      }

      .store-group-body {
        display: grid;
        padding: 0 14px 14px;
      }

      .store-group.collapsed .store-group-body {
        display: none;
      }

      .store-group-items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .item.done {
        opacity: 0.84;
      }

      .shopping-item.done .shopping-row {
        background: rgba(247, 240, 228, 0.86);
      }

      .item.done .item-name {
        color: var(--done);
        text-decoration: line-through;
        text-decoration-thickness: 3px;
        text-decoration-color: rgba(143, 151, 141, 0.85);
      }

      .item.done .item-note {
        color: #8b8f86;
      }

      .empty {
        margin: 8px 16px 0;
        padding: 22px 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.62);
        color: var(--muted);
        text-align: center;
        font-size: 1rem;
      }

      @media (max-width: 480px) {
        .app {
          padding-left: 10px;
          padding-right: 10px;
        }

        .shell {
          border-radius: 28px;
        }

        .panel-header,
        .catalog-section,
        .search-wrap,
        .store-section,
        .toolbar,
        .add-form,
        .store-form,
        .tab-bar,
        .list,
        .shopping-groups,
        .quick-add-suggestions,
        .bottom-actions {
          padding-left: 12px;
          padding-right: 12px;
        }


        .shopping-row,
        .catalog-card {
          padding: 17px 16px 17px 18px;
        }

        .item-name {
          font-size: 1.18rem;
        }

        .add-form {

      const groceryBrandByKey = new Map(TOP_GROCERY_BRANDS.map((brand) => [brand.key, brand]));
      const normalizedBrandIndex = TOP_GROCERY_BRANDS.map((brand) => ({
        ...brand,
        normalizedName: brand.name.toLowerCase().replace(/[^a-z0-9]+/g, "")
      }));

      function safeReadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return JSON.parse(raw);
          }

          const legacyRaw = window.localStorage.getItem(LEGACY_STORAGE_KEY);
          return legacyRaw ? JSON.parse(legacyRaw) : null;
        } catch (error) {
          return null;
        }
      }

      function normalizeStoreIds(storeIds) {
        return [...new Set(storeIds.map(Number).filter((id) => !Number.isNaN(id)))];
      }

      function normalizeItem(item) {
        const selectedStoreIds = Array.isArray(item.selectedStoreIds)
          ? normalizeStoreIds(item.selectedStoreIds)
          : item.preferredStoreId === null || item.preferredStoreId === undefined
            ? []
            : Number.isNaN(Number(item.preferredStoreId))
              ? []
              : [Number(item.preferredStoreId)];

        return {
          id: Number(item.id),
          name: String(item.name || "").trim(),
          note: String(item.note || "").trim(),
          done: Boolean(item.done),
          purchaseHistory: Array.isArray(item.purchaseHistory)
            ? item.purchaseHistory.filter((entry) => !Number.isNaN(Date.parse(entry)))
            : [],
          selectedStoreIds
        };
      }

      function normalizeStore(store) {
        const inferredBrand = inferStoreBrand(store.name || "");
        return {
          id: Number(store.id),
          name: String(store.name || "").trim(),
          brandKey:
            typeof store.brandKey === "string" && groceryBrandByKey.has(store.brandKey)
              ? store.brandKey
              : inferredBrand?.key || null
        };
      }

      function normalizeStoreName(name) {
        return String(name || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function inferStoreBrand(name) {
        const normalizedInput = normalizeStoreName(name);
        if (!normalizedInput) {
          return null;
        }

        const exact = normalizedBrandIndex.find((brand) => brand.normalizedName === normalizedInput);
        if (exact) {
          return exact;
        }

        const rankedMatches = normalizedBrandIndex
          .map((brand) => {
            let score = 0;

            if (brand.normalizedName.startsWith(normalizedInput)) {
              score += 4;
            }

            if (normalizedInput.startsWith(brand.normalizedName)) {
              score += 3;
            }

            if (brand.normalizedName.includes(normalizedInput) || normalizedInput.includes(brand.normalizedName)) {
              score += 2;
            }

            return { brand, score };
          })
          .filter((entry) => entry.score > 0)
          .sort((a, b) => b.score - a.score || a.brand.name.length - b.brand.name.length);

        return rankedMatches[0]?.brand || null;
      }

          : seedStores.map(normalizeStore);

          item.selectedStoreIds = item.selectedStoreIds.filter((storeId) => validStoreIds.has(storeId));

        const validIds = new Set(catalog.map((item) => item.id));

          ? savedOrder
          : seedShoppingOrder.filter((id) => validIds.has(id));
        const nextId = Math.max(0, ...catalog.map((item) => item.id)) + 1;
        const nextStoreId = Math.max(0, ...stores.map((store) => store.id)) + 1;

        return { catalog, shoppingOrder, stores, nextId, nextStoreId };
      }

      const showCatalogButton = document.getElementById("show-catalog");
      const showShoppingButton = document.getElementById("show-shopping");
      const shoppingList = document.getElementById("shopping-list");
      const catalogList = document.getElementById("catalog-list");
      const storeList = document.getElementById("store-list");
      const shoppingEmpty = document.getElementById("shopping-empty");
      const catalogEmpty = document.getElementById("catalog-empty");

      const shoppingElements = new Map();
      const catalogElements = new Map();
      const collapsedGroups = new Set();
      const SHOPPING_HASH = "#shopping";
      const CATALOG_HASH = "#all";
      let activeTab = "items";
      let openStoreMenuItemId = null;

      function persistState() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              catalog,
              shoppingOrder,
              stores
            })
          );
        } catch (error) {
          // Ignore storage failures and keep the UI responsive.
        }
      }

      function getLastPurchased(item) {
        return item.purchaseHistory[item.purchaseHistory.length - 1] || null;
      }

      function getStoreName(storeId) {
        if (storeId === null || storeId === undefined) {
          return "";
        }

        return stores.find((store) => store.id === storeId)?.name || "";
      }

      function getStoreById(storeId) {
        return stores.find((store) => store.id === storeId) || null;
      }

      function getItemStoreIds(item) {
        return Array.isArray(item.selectedStoreIds) ? item.selectedStoreIds : [];
      }

      function getPrimaryStoreId(item) {
        return getItemStores(item)[0]?.id ?? null;
      }

      function getItemStores(item) {
        const storeIdSet = new Set(getItemStoreIds(item));
        return sortedStores().filter((store) => storeIdSet.has(store.id));
      }

      function getItemStoreNames(item) {
        return getItemStores(item).map((store) => store.name);
      }

      function getStoreBrand(store) {
        if (!store?.brandKey) {
          return null;
        }

        return groceryBrandByKey.get(store.brandKey) || null;
      }

      function applyStoreCircleStyle(element, store) {
        const brand = getStoreBrand(store);
        if (!brand) {
          element.style.removeProperty("background");
          element.style.removeProperty("color");
          element.style.removeProperty("border-color");
          return;
        }

        element.style.background = brand.bg;
        element.style.color = brand.fg;
        element.style.borderColor = brand.bg;
      }

      function formatRelativePurchase(dateString) {
        if (!dateString) {
          return "Never purchased";
        }

        const timestamp = Date.parse(dateString);
        if (Number.isNaN(timestamp)) {
          return "Never purchased";
        }

        const elapsed = Date.now() - timestamp;
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const week = 7 * day;
        const month = 30 * day;
        const year = 365 * day;

        if (elapsed < minute) {
          return "Last purchased just now";
        }

        if (elapsed < hour) {
          const minutes = Math.floor(elapsed / minute);
          return `Last purchased ${minutes} minute${minutes === 1 ? "" : "s"} ago`;
        }

        if (elapsed < day) {
          const hours = Math.floor(elapsed / hour);
          return `Last purchased ${hours} hour${hours === 1 ? "" : "s"} ago`;
        }

        if (elapsed < week) {
          const days = Math.floor(elapsed / day);
          return `Last purchased ${days} day${days === 1 ? "" : "s"} ago`;
        }

        if (elapsed < month) {
          const weeks = Math.floor(elapsed / week);
          return `Last purchased ${weeks} week${weeks === 1 ? "" : "s"} ago`;
        }

        if (elapsed < year) {
          const months = Math.floor(elapsed / month);
          return `Last purchased ${months} month${months === 1 ? "" : "s"} ago`;
        }

        const years = Math.floor(elapsed / year);
        return `Last purchased ${years} year${years === 1 ? "" : "s"} ago`;
      }

      function syncStageHeight() {}

      function shoppingItems() {
        const query = shoppingSearch.value.trim().toLowerCase();
        return shoppingOrder
          .map((id) => itemsById.get(id))
          .filter(Boolean)
          .filter((item) => {
            if (!query) {
              return true;
            }

            return (
              item.name.toLowerCase().includes(query) ||
              item.note.toLowerCase().includes(query) ||
              getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
            );
          });
      }

      function catalogItems() {
        const query = catalogSearch.value.trim().toLowerCase();
        return catalog.filter((item) => {
          if (!query) {
            return true;
          }

          return (
            item.name.toLowerCase().includes(query) ||
            item.note.toLowerCase().includes(query) ||
            getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
          );
        });
      }

      function refreshShoppingButtons() {
        clearShoppingButton.disabled = shoppingOrder.length === 0;
        moveMarkedButton.disabled = !shoppingOrder.some((id) => itemsById.get(id)?.done);
      }

      function sortedStores() {
        return [...stores].sort((a, b) => a.name.localeCompare(b.name));
      }

      function renderStoreList() {
        const fragment = document.createDocumentFragment();

        sortedStores().forEach((store) => {
          const bubble = document.createElement("button");
          bubble.type = "button";
          bubble.className = "store-circle store-pill";
          bubble.title = `Remove ${store.name}`;
          bubble.setAttribute("aria-label", `Remove ${store.name}`);
          bubble.textContent = store.name;
          bubble.addEventListener("click", () => {
            removeStore(store.id);
          });
          applyStoreCircleStyle(bubble, store);
          fragment.append(bubble);
        });

        storeList.replaceChildren(fragment);
        storeCount.textContent = stores.length;
        renderStoreSuggestions();
        syncStageHeight();
      }

      function renderStoreSuggestions() {
        const query = storeSearchInput.value.trim().toLowerCase();
        const existingStoreKeys = new Set(stores.map((s) => s.brandKey).filter(Boolean));
        const existingStoreNames = new Set(stores.map((s) => s.name.toLowerCase()));

        const filteredBrands = TOP_GROCERY_BRANDS
          .filter((brand) => {
            if (existingStoreKeys.has(brand.key)) return false;
            if (existingStoreNames.has(brand.name.toLowerCase())) return false;
            if (!query) return true;
            return brand.name.toLowerCase().includes(query);
          })
          .sort((a, b) => a.name.localeCompare(b.name));

        const fragment = document.createDocumentFragment();

        // If user typed something that doesn't match any brand, show "Add custom" option
        if (query && !filteredBrands.some((b) => b.name.toLowerCase() === query)) {
          const customBtn = document.createElement("button");
          customBtn.type = "button";
          customBtn.className = "store-suggestion";
          customBtn.textContent = `Add "${storeSearchInput.value.trim()}"`;
          customBtn.addEventListener("click", () => {
            addStoreByName(storeSearchInput.value.trim());
          });
          fragment.append(customBtn);
        }

        filteredBrands.forEach((brand) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "store-suggestion";
          btn.textContent = brand.name;
          btn.addEventListener("click", () => {
            addStoreByName(brand.name);
          });
          fragment.append(btn);
        });

        storeSuggestions.replaceChildren(fragment);
      }

      function addStoreByName(rawName) {
        const name = rawName.trim();
        if (!name) return;

        const matchedBrand = inferStoreBrand(name);
        const resolvedName = matchedBrand?.name || name;

        const existingStore = stores.find((store) => {
          if (matchedBrand && store.brandKey === matchedBrand.key) return true;
          return store.name.toLowerCase() === resolvedName.toLowerCase();
        });

        if (!existingStore) {
          const store = {
            id: nextStoreId++,
            name: resolvedName,
            brandKey: matchedBrand?.key || null
          };
          stores.push(store);
        }

        storeSearchInput.value = "";
        renderStoreList();
        refreshCatalogPurchaseLabels();
        persistState();
      }

      function renderQuickAddSuggestions() {
        const query = quickAddInput.value.trim().toLowerCase();

        if (!query) {
          quickAddSuggestions.replaceChildren();
          return;
        }

        const fragment = document.createDocumentFragment();

        // Find matching catalog items
        const matchingItems = catalog
          .filter((item) => item.name.toLowerCase().includes(query))
          .slice(0, 5); // Limit to 5 suggestions

        matchingItems.forEach((item) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const onList = shoppingSet.has(item.id);
          const onListAndActive = onList && !item.done;
          btn.className = `quick-add-item${onListAndActive ? " on-list" : ""}`;
          btn.addEventListener("click", () => {
            // Always call addToShoppingList - it will unmark if already on list
            addToShoppingList(item.id);
            quickAddInput.value = "";
            renderQuickAddSuggestions();
          });

          const info = document.createElement("div");
          info.className = "quick-add-item-info";

          const name = document.createElement("div");
          name.className = "quick-add-item-name";
          name.textContent = item.name;

          const meta = document.createElement("div");
          meta.className = "quick-add-item-meta";
          meta.textContent = item.note || formatRelativePurchase(getLastPurchased(item));

          info.append(name, meta);

          const storeChips = document.createElement("div");
          storeChips.className = "quick-add-item-stores";
          getItemStores(item).forEach((store) => {
            const chip = document.createElement("div");
            chip.className = "store-circle catalog-store-chip";
            chip.textContent = store.name.charAt(0).toUpperCase();
            applyStoreCircleStyle(chip, store);
            storeChips.append(chip);
          });

          btn.append(info, storeChips);
          fragment.append(btn);
        });

        // Show "Add new item" option if query doesn't exactly match an existing item
        const exactMatch = catalog.some((item) => item.name.toLowerCase() === query);
        if (!exactMatch) {
          const addNewBtn = document.createElement("button");
          addNewBtn.type = "button";
          addNewBtn.className = "quick-add-item quick-add-new";
          addNewBtn.addEventListener("click", () => {
            quickAddNewItem(quickAddInput.value.trim());
          });

          const info = document.createElement("div");
          info.className = "quick-add-item-info";

          const name = document.createElement("div");
          name.className = "quick-add-item-name";
          name.textContent = `Add "${quickAddInput.value.trim()}"`;

          const meta = document.createElement("div");
          meta.className = "quick-add-item-meta";
          meta.textContent = "Create new item and add to list";

          info.append(name, meta);

          // Show store buttons for quick selection
          const storeChips = document.createElement("div");
          storeChips.className = "quick-add-item-stores";
          sortedStores().forEach((store) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "store-circle catalog-store-chip";
            chip.title = store.name;
            chip.textContent = store.name.charAt(0).toUpperCase();
            chip.addEventListener("click", (e) => {
              e.stopPropagation();
              chip.classList.toggle("selected");
            });
            applyStoreCircleStyle(chip, store);
            storeChips.append(chip);
          });

          addNewBtn.append(info, storeChips);
          fragment.append(addNewBtn);
        }

        quickAddSuggestions.replaceChildren(fragment);
      }

      function quickAddNewItem(name) {
        if (!name) return;

        // Get selected stores from the chips
        const selectedStoreIds = [];
        quickAddSuggestions.querySelectorAll(".quick-add-new .store-circle.selected").forEach((chip) => {
          const storeName = chip.title;
          const store = stores.find((s) => s.name === storeName);
          if (store) {
            selectedStoreIds.push(store.id);
          }
        });

        // Create new item
        const item = {
          id: nextId++,
          name,
          note: "",
          done: false,
          purchaseHistory: [],
          selectedStoreIds
        };

        catalog.unshift(item);
        itemsById.set(item.id, item);
        createCatalogItemElement(item);
        createShoppingItemElement(item);

        // Add to shopping list
        shoppingSet.add(item.id);
        shoppingOrder.unshift(item.id);

        persistState();
        renderCatalogSection();
        syncCatalogVisibleList();
        syncShoppingVisibleList();
        refreshShoppingButtons();

        quickAddInput.value = "";
        renderQuickAddSuggestions();
      }

      function renderCatalogSection() {
        catalogCount.textContent = catalog.length;
        syncStageHeight();
      }

      function switchTab(tab) {
        activeTab = tab;
        tabItems.classList.toggle("active", tab === "items");
        tabStores.classList.toggle("active", tab === "stores");
        tabItems.setAttribute("aria-selected", String(tab === "items"));
        tabStores.setAttribute("aria-selected", String(tab === "stores"));
        tabContentItems.classList.toggle("active", tab === "items");
        tabContentStores.classList.toggle("active", tab === "stores");
        syncStageHeight();
      }

      function updateShoppingItemElement(item) {
        const parts = shoppingElements.get(item.id);
        if (!parts) {
          return;
        }

        parts.li.classList.toggle("done", item.done);
        parts.button.setAttribute("aria-pressed", String(item.done));
        parts.button.setAttribute(
          "aria-label",
          `${item.done ? "Unmark" : "Mark"} ${item.name} ${item.done ? "as not done" : "done"}`
        );
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.store.hidden = true;
      }

      function updateCatalogItemElement(item) {
        const parts = catalogElements.get(item.id);
        if (!parts) {
          return;
        }

        const onList = shoppingSet.has(item.id);
        parts.li.classList.toggle("on-list", onList);
        parts.card.setAttribute(
          "aria-label",
          onList ? `Remove ${item.name} from shopping list` : `Add ${item.name} to shopping list`
        );
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.meta.textContent = formatRelativePurchase(getLastPurchased(item));
        parts.state.classList.toggle("off", !onList);
        parts.state.textContent = onList ? "On list" : "Add to list";
        parts.storeButton.textContent = "Stores";
        parts.storeButton.title = `Choose stores for ${item.name}`;
        parts.storeMenu.hidden = openStoreMenuItemId !== item.id || stores.length === 0;

        const chips = document.createDocumentFragment();
        getItemStores(item).forEach((store) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "store-circle catalog-store-chip";
          chip.title = `Remove ${store.name} from ${item.name}`;
          chip.setAttribute("aria-label", `Remove ${store.name} from ${item.name}`);
          chip.textContent = store.name.charAt(0).toUpperCase();
          chip.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleItemStoreSelection(item.id, store.id);
          });
          applyStoreCircleStyle(chip, store);
          chips.append(chip);
        });
        parts.storeChips.replaceChildren(chips);

        const menuOptions = document.createDocumentFragment();
        sortedStores().forEach((store) => {
          const option = document.createElement("button");
          option.type = "button";
          option.className = `catalog-store-option${getItemStoreIds(item).includes(store.id) ? " active" : ""}`;
          option.setAttribute("aria-pressed", String(getItemStoreIds(item).includes(store.id)));
          option.addEventListener("click", (event) => {
            event.stopPropagation();
            toggleItemStoreSelection(item.id, store.id);
          });

          const icon = document.createElement("div");
          icon.className = "store-circle catalog-store-chip";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = store.name.charAt(0).toUpperCase();
          applyStoreCircleStyle(icon, store);

          const label = document.createElement("div");
          label.className = "catalog-store-option-label";
          label.textContent = store.name;

          option.append(icon, label);
          menuOptions.append(option);
        });
        parts.storeMenu.replaceChildren(menuOptions);
      }

      function createShoppingItemElement(item) {
        const li = document.createElement("li");
        li.className = `item shopping-item${item.done ? " done" : ""}`;

        const button = document.createElement("button");
        button.className = "shopping-row";
        button.type = "button";
        button.addEventListener("click", () => {
          const wasDone = item.done;
          item.done = !item.done;

          if (!wasDone && item.done) {
            item.purchaseHistory.push(new Date().toISOString());
            updateCatalogItemElement(item);
            persistState();
          } else if (wasDone && !item.done) {
            persistState();
          }

          updateShoppingItemElement(item);
          refreshShoppingButtons();
        });

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const store = document.createElement("div");
        store.className = "item-meta";

        main.append(name, note, store);
        button.append(main);
        li.append(button);

        shoppingElements.set(item.id, { li, button, note, store });
        updateShoppingItemElement(item);
      }

      function createCatalogItemElement(item) {
        const li = document.createElement("li");
        li.className = "item catalog-item";

        const card = document.createElement("button");
        card.type = "button";
        card.className = "catalog-card";
        card.addEventListener("click", () => {
          toggleShoppingListItem(item.id);
        });

        const main = document.createElement("div");
        main.className = "catalog-main";

        const itemMain = document.createElement("div");
        itemMain.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const meta = document.createElement("div");
        meta.className = "item-meta";

        const footer = document.createElement("div");
        footer.className = "catalog-footer";

        const state = document.createElement("div");
        state.className = "catalog-state";

        const storeTools = document.createElement("div");
        storeTools.className = "catalog-store-tools";

        const storeChips = document.createElement("div");
        storeChips.className = "catalog-store-chips";

        const storeButton = document.createElement("button");
        storeButton.className = "catalog-store-button";
        storeButton.type = "button";
        storeButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (stores.length === 0) {
            switchTab("stores");
            storeSearchInput.focus();
            return;
          }

          setOpenStoreMenu(openStoreMenuItemId === item.id ? null : item.id);
        });

        const storeMenu = document.createElement("div");
        storeMenu.className = "catalog-store-menu";
        storeMenu.hidden = true;
        storeMenu.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        storeTools.append(storeChips, storeButton, storeMenu);
        footer.append(state, storeTools);
        itemMain.append(name, note, meta);
        main.append(itemMain);
        card.append(main, footer);
        li.append(card);

        catalogElements.set(item.id, {
          li,
          card,
          note,
          meta,
          state,
          storeChips,
          storeButton,
          storeMenu
        });
        updateCatalogItemElement(item);
      }

      function refreshCatalogPurchaseLabels() {
        catalog.forEach((item) => {
          updateCatalogItemElement(item);
        });
      }

      function storeGroupKey(storeId) {
        return storeId === null ? "any" : `store-${storeId}`;
      }

      function storeGroupName(storeId) {
        return storeId === null ? "Any Store" : getStoreName(storeId);
      }

      function groupedShoppingItems() {
        const groups = new Map();

        shoppingItems().forEach((item) => {
          const storeIds = getItemStoreIds(item);

          // If item has no stores, put in "Any Store" group
          if (storeIds.length === 0) {
            const key = storeGroupKey(null);
            if (!groups.has(key)) {
              groups.set(key, {
                key,
                storeId: null,
                name: storeGroupName(null),
                items: []
              });
            }
            groups.get(key).items.push(item);
          } else {
            // Add item to ALL its store groups
            storeIds.forEach((storeId) => {
              const key = storeGroupKey(storeId);
              if (!groups.has(key)) {
                groups.set(key, {
                  key,
                  storeId: storeId,
                  name: storeGroupName(storeId),
                  items: []
                });
              }
              groups.get(key).items.push(item);
            });
          }
        });

        // Sort groups: "Any Store" first, then alphabetically by store name
        return [...groups.values()].sort((a, b) => {
          if (a.storeId === null) return -1;
          if (b.storeId === null) return 1;
          return a.name.localeCompare(b.name);
        });
      }

      function moveStoreToTop(storeId) {
        const targetIds = shoppingOrder.filter((id) => {
          const item = itemsById.get(id);
          if (storeId === null) {
            return getItemStoreIds(item).length === 0;
          }
          return getItemStoreIds(item).includes(storeId);
        });
        if (targetIds.length === 0) {
          return;
        }

        const targetSet = new Set(targetIds);
        const remainingIds = shoppingOrder.filter((id) => !targetSet.has(id));
        shoppingOrder.splice(0, shoppingOrder.length, ...targetIds, ...remainingIds);
        persistState();
        syncShoppingVisibleList();
      }

      function syncShoppingVisibleList() {
        const groups = groupedShoppingItems();
        const nodes = groups.map((group) => {
          const completedCount = group.items.filter((item) => item.done).length;
          const totalCount = group.items.length;
          const allDone = completedCount === totalCount && totalCount > 0;

          // Auto-collapse when all items are done
          if (allDone && !collapsedGroups.has(group.key)) {
            collapsedGroups.add(group.key);
          }

          const isCollapsed = collapsedGroups.has(group.key);

          const section = document.createElement("section");
          section.className = `store-group${isCollapsed ? " collapsed" : ""}${allDone ? " all-done" : ""}`;

          const header = document.createElement("div");
          header.className = "store-group-header";

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "store-group-toggle";
          toggle.addEventListener("click", () => {
            if (collapsedGroups.has(group.key)) {
              collapsedGroups.delete(group.key);
            } else {
              collapsedGroups.add(group.key);
            }
            syncShoppingVisibleList();
          });

          const title = document.createElement("div");
          title.className = "store-group-title";

          const strong = document.createElement("strong");
          strong.textContent = group.name;

          const count = document.createElement("span");
          count.textContent = `${completedCount}/${totalCount}`;

          const chevron = document.createElement("div");
          chevron.className = "store-group-chevron";
          chevron.textContent = allDone ? "✓" : (isCollapsed ? "+" : "-");

          title.append(strong, count);
          toggle.append(title, chevron);

          const moveButton = document.createElement("button");
          moveButton.type = "button";
          moveButton.className = "store-group-icon";
          moveButton.textContent = "↑";
          moveButton.title = `Move ${group.name} to top`;
          moveButton.setAttribute("aria-label", `Move ${group.name} to top`);
          moveButton.addEventListener("click", () => {
            moveStoreToTop(group.storeId);
          });

          header.append(toggle, moveButton);

          const body = document.createElement("div");
          body.className = "store-group-body";

          const items = document.createElement("ul");
          items.className = "store-group-items";
          items.append(...group.items.map((item) => {
            const parts = shoppingElements.get(item.id);
            // Clone the element and re-attach click handler since cloneNode doesn't clone event listeners
            const li = parts.li.cloneNode(true);
            li.querySelector(".shopping-row").addEventListener("click", () => {
              const wasDone = item.done;
              item.done = !item.done;

              if (!wasDone && item.done) {
                item.purchaseHistory.push(new Date().toISOString());
                updateCatalogItemElement(item);
                persistState();
              } else if (wasDone && !item.done) {
                persistState();
              }

              // Update master element before re-rendering (so clones are up to date)
              updateShoppingItemElement(item);
              syncShoppingVisibleList();
              refreshShoppingButtons();
            });
            return li;
          }));

          body.append(items);
          section.append(header, body);
          return section;
        });

        shoppingList.replaceChildren(...nodes);
        shoppingEmpty.hidden = nodes.length > 0;
        refreshShoppingButtons();
        syncStageHeight();
      }

      function syncCatalogVisibleList() {
        const nodes = catalogItems().map((item) => catalogElements.get(item.id).li);
        catalogList.replaceChildren(...nodes);
        catalogEmpty.hidden = nodes.length > 0;
        syncStageHeight();
      }

      function moveItemToTop(id) {
        const index = shoppingOrder.indexOf(id);
        if (index <= 0) {
          return;
        }

        shoppingOrder.splice(index, 1);
        shoppingOrder.unshift(id);
      }

      function removeFromShoppingList(id) {
        if (!shoppingSet.has(id)) {
          return;
        }

        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;
        shoppingSet.delete(id);

        const index = shoppingOrder.indexOf(id);
        if (index !== -1) {
          shoppingOrder.splice(index, 1);
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
      }

      function setOpenStoreMenu(itemId) {
        const previousId = openStoreMenuItemId;
        openStoreMenuItemId = itemId;

        if (previousId !== null) {
          const previousParts = catalogElements.get(previousId);
          if (previousParts) {
            previousParts.li.classList.remove("menu-open");
          }
          const previousItem = itemsById.get(previousId);
          if (previousItem) {
            updateCatalogItemElement(previousItem);
          }
        }

        if (itemId !== null) {
          const currentParts = catalogElements.get(itemId);
          if (currentParts) {
            currentParts.li.classList.add("menu-open");
          }
          if (itemId !== previousId) {
            const currentItem = itemsById.get(itemId);
            if (currentItem) {
              updateCatalogItemElement(currentItem);
            }
          }
        }

        syncStageHeight();
      }

      function removeStore(storeId) {
        const index = stores.findIndex((store) => store.id === storeId);
        if (index === -1) {
          return;
        }

        stores.splice(index, 1);
        catalog.forEach((item) => {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
          updateCatalogItemElement(item);
          updateShoppingItemElement(item);
        });

        if (stores.length === 0) {
          setOpenStoreMenu(null);
        }

        renderStoreList();
        persistState();
        syncShoppingVisibleList();
      }

      function toggleItemStoreSelection(id, storeId) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        if (!stores.some((store) => store.id === storeId)) {
          return;
        }

        if (getItemStoreIds(item).includes(storeId)) {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
        } else {
          item.selectedStoreIds = [...getItemStoreIds(item), storeId];
        }

        updateCatalogItemElement(item);
        updateShoppingItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function addToShoppingList(id) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;

        if (shoppingSet.has(id)) {
          moveItemToTop(id);
        } else {
          shoppingSet.add(id);
          shoppingOrder.unshift(id);
          if (!shoppingElements.has(id)) {
            createShoppingItemElement(item);
          }
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function toggleShoppingListItem(id) {
        if (shoppingSet.has(id)) {
          removeFromShoppingList(id);
          syncShoppingVisibleList();
          return;
        }

        addToShoppingList(id);
      }

      function isCatalogHash(hash) {
        return hash === CATALOG_HASH || hash === "#all-items";
      }

      function isShoppingHash(hash) {
        return hash === SHOPPING_HASH || hash === "#shopping-list";
      }

      function syncPanelFromLocation() {
        const currentHash = window.location.hash;
        setFlipped(isCatalogHash(currentHash), false);
        const normalizedHash = isCatalogHash(currentHash) ? CATALOG_HASH : SHOPPING_HASH;
        if (currentHash !== normalizedHash) {
          window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${normalizedHash}`);
        }
      }

      function navigateToPanel(isFlipped) {
        const nextHash = isFlipped ? CATALOG_HASH : SHOPPING_HASH;
        if (window.location.hash === nextHash) {
          setFlipped(isFlipped, false);
          return;
        }

        window.location.hash = nextHash;
      }

      function setFlipped(isFlipped, updateUrl = true) {
        setOpenStoreMenu(null);
        shoppingPanel.hidden = isFlipped;
        catalogPanel.hidden = !isFlipped;
        if (updateUrl) {
          navigateToPanel(isFlipped);
          return;
        }
      }

      catalog.forEach((item) => {
        createCatalogItemElement(item);

        if (shoppingSet.has(item.id)) {
          createShoppingItemElement(item);
        }
      });

      renderStoreSuggestions();
      renderStoreList();
      renderCatalogSection();
      syncShoppingVisibleList();
      syncCatalogVisibleList();
      if (!isCatalogHash(window.location.hash) && !isShoppingHash(window.location.hash)) {
        window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${SHOPPING_HASH}`);
      }
      syncPanelFromLocation();

      shoppingSearch.addEventListener("input", syncShoppingVisibleList);
      catalogSearch.addEventListener("input", syncCatalogVisibleList);
      window.addEventListener("hashchange", syncPanelFromLocation);
      document.addEventListener("click", () => {
        if (openStoreMenuItemId !== null) {
          setOpenStoreMenu(null);
        }
      });

      tabItems.addEventListener("click", () => {
        switchTab("items");
      });

      tabStores.addEventListener("click", () => {
        switchTab("stores");
      });

      storeSearchInput.addEventListener("input", renderStoreSuggestions);
      quickAddInput.addEventListener("input", renderQuickAddSuggestions);

      clearShoppingButton.addEventListener("click", () => {
        const hasUnmarkedItems = shoppingOrder.some((id) => !itemsById.get(id).done);
        if (hasUnmarkedItems) {
          const confirmed = window.confirm("Clear the shopping list? You still have unmarked items.");
          if (!confirmed) {
            return;
          }
        }

        shoppingOrder.splice(0, shoppingOrder.length);
        shoppingSet.clear();

        catalog.forEach((item) => {
          item.done = false;
          updateCatalogItemElement(item);
        });

        persistState();
        syncShoppingVisibleList();
      });

      moveMarkedButton.addEventListener("click", () => {
        if (!shoppingOrder.some((id) => itemsById.get(id).done)) {
          return;
        }

        const openItems = shoppingOrder.filter((id) => !itemsById.get(id).done);
        const doneItems = shoppingOrder.filter((id) => itemsById.get(id).done);
        shoppingOrder.splice(0, shoppingOrder.length, ...openItems, ...doneItems);
        persistState();
        syncShoppingVisibleList();
      });

      showCatalogButton.addEventListener("click", () => {
        setFlipped(true);
      });

      showShoppingButton.addEventListener("click", () => {
        setFlipped(false);
      });

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = newItemInput.value.trim();
        if (!name) {
          return;
        }

        const item = {
          id: nextId++,
          name,
          note: "",
          done: false,
          purchaseHistory: [],
          selectedStoreIds: []
        };

        catalog.unshift(item);
        itemsById.set(item.id, item);
        createCatalogItemElement(item);
        persistState();
        renderCatalogSection();
        newItemInput.value = "";
        syncCatalogVisibleList();
        newItemInput.focus();
      });

      window.addEventListener("resize", syncStageHeight);
      window.setInterval(refreshCatalogPurchaseLabels, 60 * 1000);
      syncStageHeight();
    </script>
  </body>
</html>
