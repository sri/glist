<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grocery List</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css"
    />
    <script>
      document.documentElement.classList.add(
        window.matchMedia("(prefers-color-scheme: dark)").matches ? "sl-theme-dark" : "sl-theme-light"
      );
    </script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: var(--sl-font-sans);
      }

      .shoelace-app {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      }

      .shoelace-shell {
        display: grid;
        gap: 18px;
        padding: 18px;
      }

      .panel-view {
        display: grid;
        gap: 16px;
      }

      .panel-view[hidden] {
        display: none;
      }

      .panel-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      .panel-title-block {
        display: grid;
        gap: 2px;
      }

      .panel-title-block strong {
        font-size: 1.25rem;
      }

      .eyebrow,
      .tab-meta,
      .item-note,
      .item-meta,
      .store-summary-title span {
        color: var(--sl-color-neutral-500);
      }

      .eyebrow {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .footer-actions,
      .inline-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      .footer-actions sl-button::part(base) {
        min-height: 72px;
      }

      .tab-stack,
      .shopping-groups,
      .catalog-list,
      .store-pill-list,
      .shopping-items {
        display: grid;
        gap: 14px;
      }

      .store-pill-list {
        grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      }

      .catalog-tabs::part(body) {
        padding-top: 18px;
      }

      .shopping-group::part(summary) {
        padding: 10px 14px;
      }

      .store-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
      }

      .store-summary-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .shopping-card::part(body),
      .catalog-card::part(body) {
        padding: 0;
      }

      .shopping-row-button,
      .catalog-main-button {
        width: 100%;
        display: grid;
        align-items: center;
        gap: 14px;
        padding: 20px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }

      .shopping-row-button {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .catalog-main-button {
        grid-template-columns: 1fr;
        padding-bottom: 10px;
      }

      .item-main {
        display: grid;
        gap: 6px;
      }

      .item-name {
        font-size: 1.36rem;
        line-height: 1.08;
        font-weight: 700;
      }

      .shopping-card.done .item-name {
        text-decoration: line-through;
      }

      .shopping-toggle {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.35rem;
        color: transparent;
        border: 2px solid var(--sl-color-neutral-300);
      }

      .shopping-card.done .shopping-toggle {
        color: currentColor;
      }

      .catalog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 20px 18px;
        flex-wrap: wrap;
      }

      .catalog-store-tools,
      .catalog-store-tags {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .catalog-store-tools {
        margin-left: auto;
      }

      .panel-switch::part(base) {
        min-width: 52px;
        min-height: 52px;
      }

      .store-menu-list {
        display: grid;
        gap: 10px;
        min-width: 220px;
        padding: 8px;
      }

      @media (max-width: 480px) {
        .shoelace-app {
          padding-left: 10px;
          padding-right: 10px;
        }

        .footer-actions,
        .inline-form {
          grid-template-columns: 1fr;
        }

        .item-name {
          font-size: 1.18rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shoelace-app">
      <section id="shell" class="shoelace-shell">
        <section id="shopping-panel" class="panel-view" aria-label="Shopping list">
          <header class="panel-head">
            <sl-input
              id="shopping-search"
              class="panel-search"
              size="large"
              filled
              clearable
              placeholder="search..."
              aria-label="Search shopping list"
            ></sl-input>
            <sl-tooltip content="All Items">
              <sl-button
                id="show-catalog"
                class="panel-switch"
                size="large"
                circle
                aria-label="All Items"
              >
                ⚙
              </sl-button>
            </sl-tooltip>
          </header>

          <div id="shopping-list" class="shopping-groups" aria-live="polite"></div>
          <sl-card id="shopping-empty" class="empty-card" hidden>No matching items.</sl-card>

          <div class="footer-actions">
            <sl-button id="move-marked" size="large" variant="primary">Move check items down</sl-button>
            <sl-button id="clear-shopping" size="large" variant="default">Clear Items</sl-button>
          </div>
        </section>

        <section id="catalog-panel" class="panel-view" aria-label="All items" hidden>
          <header class="panel-head">
            <div class="panel-title-block">
              <span class="eyebrow">Catalog</span>
              <strong>All Items</strong>
            </div>
            <sl-tooltip content="Shopping List">
              <sl-button
                id="show-shopping"
                class="panel-switch"
                size="large"
                circle
                aria-label="Shopping List"
              >
                ⌂
              </sl-button>
            </sl-tooltip>
          </header>

          <sl-tab-group id="catalog-tabs" class="catalog-tabs">
            <sl-tab slot="nav" panel="stores">Stores</sl-tab>
            <sl-tab slot="nav" panel="items">Items</sl-tab>

            <sl-tab-panel name="stores">
              <div class="tab-stack">
                <div class="tab-meta"><span id="store-count">0 stores</span></div>
                <form id="store-form" class="inline-form">
                  <sl-input
                    id="new-store"
                    class="flex-field"
                    size="large"
                    filled
                    placeholder="add store..."
                    aria-label="Add store"
                  ></sl-input>
                  <sl-button type="submit" size="large" variant="primary">Add store</sl-button>
                </form>
                <div id="store-list" class="store-pill-list"></div>
                <datalist id="brand-store-suggestions"></datalist>
              </div>
            </sl-tab-panel>

            <sl-tab-panel name="items">
              <div class="tab-stack">
                <div class="tab-meta"><span id="catalog-count">0 items</span></div>
                <sl-input
                  id="catalog-search"
                  class="panel-search"
                  size="large"
                  filled
                  clearable
                  placeholder="search..."
                  aria-label="Search all items"
                ></sl-input>

                <form id="add-form" class="inline-form">
                  <sl-input
                    id="new-item"
                    class="flex-field"
                    size="large"
                    filled
                    placeholder="add item..."
                    aria-label="Add item"
                  ></sl-input>
                  <sl-button type="submit" size="large" variant="primary">Add</sl-button>
                </form>

                <div id="catalog-list" class="catalog-list"></div>
                <sl-card id="catalog-empty" class="empty-card" hidden>No matching items.</sl-card>
              </div>
            </sl-tab-panel>
          </sl-tab-group>
        </section>
      </section>
    </main>

      ];
      const groceryBrandByKey = new Map(TOP_GROCERY_BRANDS.map((brand) => [brand.key, brand]));
      const normalizedBrandIndex = TOP_GROCERY_BRANDS.map((brand) => ({
        ...brand,
        normalizedName: brand.name.toLowerCase().replace(/[^a-z0-9]+/g, "")
      }));

      function safeReadState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            return JSON.parse(raw);
          }

          const legacyRaw = window.localStorage.getItem(LEGACY_STORAGE_KEY);
          return legacyRaw ? JSON.parse(legacyRaw) : null;
        } catch (error) {
          return null;
        }
      }

      function normalizeStoreIds(storeIds) {
        return [...new Set(storeIds.map(Number).filter((id) => !Number.isNaN(id)))];
      }

      function normalizeItem(item) {
        const selectedStoreIds = Array.isArray(item.selectedStoreIds)
          ? normalizeStoreIds(item.selectedStoreIds)
          : item.preferredStoreId === null || item.preferredStoreId === undefined
            ? []
            : Number.isNaN(Number(item.preferredStoreId))
              ? []
              : [Number(item.preferredStoreId)];

        return {
          id: Number(item.id),
          name: String(item.name || "").trim(),
          note: String(item.note || "").trim(),
          done: Boolean(item.done),
          purchaseHistory: Array.isArray(item.purchaseHistory)
            ? item.purchaseHistory.filter((entry) => !Number.isNaN(Date.parse(entry)))
            : [],
          selectedStoreIds
        };
      }

      function normalizeStore(store) {
        const inferredBrand = inferStoreBrand(store.name || "");
        return {
          id: Number(store.id),
          name: String(store.name || "").trim(),
          brandKey:
            typeof store.brandKey === "string" && groceryBrandByKey.has(store.brandKey)
              ? store.brandKey
              : inferredBrand?.key || null
        };
      }

      function normalizeStoreName(name) {
        return String(name || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "");
      }

      function inferStoreBrand(name) {
        const normalizedInput = normalizeStoreName(name);
        if (!normalizedInput) {
          return null;
        }

        const exact = normalizedBrandIndex.find((brand) => brand.normalizedName === normalizedInput);
        if (exact) {
          return exact;
        }

        const rankedMatches = normalizedBrandIndex
          .map((brand) => {
            let score = 0;

            if (brand.normalizedName.startsWith(normalizedInput)) {
              score += 4;
            }

            if (normalizedInput.startsWith(brand.normalizedName)) {
              score += 3;
            }

            if (brand.normalizedName.includes(normalizedInput) || normalizedInput.includes(brand.normalizedName)) {
              score += 2;
            }

            return { brand, score };
          })
          .filter((entry) => entry.score > 0)
          .sort((a, b) => b.score - a.score || a.brand.name.length - b.brand.name.length);

        return rankedMatches[0]?.brand || null;
      }

      function buildInitialState() {
        const saved = safeReadState();
        const savedCatalog = Array.isArray(saved?.catalog) ? saved.catalog.map(normalizeItem) : null;
        const catalog = savedCatalog && savedCatalog.length > 0 ? savedCatalog : seedCatalog.map(normalizeItem);
        const savedStores = Array.isArray(saved?.stores) ? saved.stores.map(normalizeStore) : null;
        const stores = savedStores
          ? savedStores.filter((store) => store.name)
          : seedStores.map(normalizeStore);
        const validStoreIds = new Set(stores.map((store) => store.id));
        catalog.forEach((item) => {
          item.selectedStoreIds = item.selectedStoreIds.filter((storeId) => validStoreIds.has(storeId));
        });
        const validIds = new Set(catalog.map((item) => item.id));
        const savedOrder = Array.isArray(saved?.shoppingOrder)
          ? saved.shoppingOrder.map(Number).filter((id) => validIds.has(id))
          : [];
        const shoppingOrder = Array.isArray(saved?.shoppingOrder)
          ? savedOrder
          : seedShoppingOrder.filter((id) => validIds.has(id));
        const nextId = Math.max(0, ...catalog.map((item) => item.id)) + 1;
        const nextStoreId = Math.max(0, ...stores.map((store) => store.id)) + 1;

        return { catalog, shoppingOrder, stores, nextId, nextStoreId };
      }

      const state = buildInitialState();
      const catalog = state.catalog;
      const itemsById = new Map(catalog.map((item) => [item.id, item]));
      const shoppingOrder = state.shoppingOrder;
      const shoppingSet = new Set(shoppingOrder);
      const stores = state.stores;
      let nextId = state.nextId;
      let nextStoreId = state.nextStoreId;

      const shell = document.getElementById("shell");
      const shoppingPanel = document.getElementById("shopping-panel");
      const catalogPanel = document.getElementById("catalog-panel");
      const shoppingSearch = document.getElementById("shopping-search");
      const catalogSearch = document.getElementById("catalog-search");
      const catalogTabs = document.getElementById("catalog-tabs");
      const catalogCount = document.getElementById("catalog-count");
      const storeCount = document.getElementById("store-count");
      const newItemInput = document.getElementById("new-item");
      const newStoreInput = document.getElementById("new-store");
      const addForm = document.getElementById("add-form");
      const storeForm = document.getElementById("store-form");
      const clearShoppingButton = document.getElementById("clear-shopping");
      const moveMarkedButton = document.getElementById("move-marked");
      const showCatalogButton = document.getElementById("show-catalog");
      const showShoppingButton = document.getElementById("show-shopping");
      const shoppingList = document.getElementById("shopping-list");
      const catalogList = document.getElementById("catalog-list");
      const storeList = document.getElementById("store-list");
      const shoppingEmpty = document.getElementById("shopping-empty");
      const catalogEmpty = document.getElementById("catalog-empty");

      const shoppingElements = new Map();
      const catalogElements = new Map();
      const collapsedGroups = new Set();
      const SHOPPING_HASH = "#shopping";
      const CATALOG_HASH = "#all";
      const UP_ICON =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='currentColor'><path d='M8 3.293 4.354 6.939 2.939 5.525 8 0.464l5.061 5.061-1.414 1.414L8 3.293z'/><path d='M7 2h2v14H7z'/></svg>"
        );

      function persistState() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              catalog,
              shoppingOrder,
              stores
            })
          );
        } catch (error) {
          // Ignore storage failures and keep the UI responsive.
        }
      }

      function getLastPurchased(item) {
        return item.purchaseHistory[item.purchaseHistory.length - 1] || null;
      }

      function getStoreName(storeId) {
        if (storeId === null || storeId === undefined) {
          return "";
        }

        return stores.find((store) => store.id === storeId)?.name || "";
      }

      function getStoreById(storeId) {
        return stores.find((store) => store.id === storeId) || null;
      }

      function getFieldValue(field) {
        if (!field) {
          return "";
        }

        if (typeof field.value === "string") {
          return field.value;
        }

        return field.getAttribute("value") || "";
      }

      function getItemStoreIds(item) {
        return Array.isArray(item.selectedStoreIds) ? item.selectedStoreIds : [];
      }

      function getPrimaryStoreId(item) {
        return getItemStores(item)[0]?.id ?? null;
      }

      function getItemStores(item) {
        const storeIdSet = new Set(getItemStoreIds(item));
        return sortedStores().filter((store) => storeIdSet.has(store.id));
      }

      function getItemStoreNames(item) {
        return getItemStores(item).map((store) => store.name);
      }

      function getStoreBrand(store) {
        if (!store?.brandKey) {
          return null;
        }

        return groceryBrandByKey.get(store.brandKey) || null;
      }

      function applyStoreCircleStyle(element, store) {
        // Store matching still exists, but visual styling now uses the default Shoelace theme.
      }

      function renderStoreSuggestions() {
        const suggestions = document.getElementById("brand-store-suggestions");
        if (!suggestions) {
          return;
        }

        const optionNodes = TOP_GROCERY_BRANDS
          .map((brand) => brand.name)
          .sort((a, b) => a.localeCompare(b))
          .map((name) => {
            const option = document.createElement("option");
            option.value = name;
            return option;
          });

        suggestions.replaceChildren(...optionNodes);
      }

      function formatRelativePurchase(dateString) {
        if (!dateString) {
          return "Never purchased";
        }

        const timestamp = Date.parse(dateString);
        if (Number.isNaN(timestamp)) {
          return "Never purchased";
        }

        const elapsed = Date.now() - timestamp;
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const week = 7 * day;
        const month = 30 * day;
        const year = 365 * day;

        if (elapsed < minute) {
          return "Last purchased just now";
        }

        if (elapsed < hour) {
          const minutes = Math.floor(elapsed / minute);
          return `Last purchased ${minutes} minute${minutes === 1 ? "" : "s"} ago`;
        }

        if (elapsed < day) {
          const hours = Math.floor(elapsed / hour);
          return `Last purchased ${hours} hour${hours === 1 ? "" : "s"} ago`;
        }

        if (elapsed < week) {
          const days = Math.floor(elapsed / day);
          return `Last purchased ${days} day${days === 1 ? "" : "s"} ago`;
        }

        if (elapsed < month) {
          const weeks = Math.floor(elapsed / week);
          return `Last purchased ${weeks} week${weeks === 1 ? "" : "s"} ago`;
        }

        if (elapsed < year) {
          const months = Math.floor(elapsed / month);
          return `Last purchased ${months} month${months === 1 ? "" : "s"} ago`;
        }

        const years = Math.floor(elapsed / year);
        return `Last purchased ${years} year${years === 1 ? "" : "s"} ago`;
      }

      function syncStageHeight() {
        // Panels use normal flow in the Shoelace layout.
      }

      function shoppingItems() {
        const query = getFieldValue(shoppingSearch).trim().toLowerCase();
        return shoppingOrder
          .map((id) => itemsById.get(id))
          .filter(Boolean)
          .filter((item) => {
            if (!query) {
              return true;
            }

            return (
              item.name.toLowerCase().includes(query) ||
              item.note.toLowerCase().includes(query) ||
              getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
            );
          });
      }

      function catalogItems() {
        const query = getFieldValue(catalogSearch).trim().toLowerCase();
        return catalog.filter((item) => {
          if (!query) {
            return true;
          }

          return (
            item.name.toLowerCase().includes(query) ||
            item.note.toLowerCase().includes(query) ||
            getItemStoreNames(item).some((storeName) => storeName.toLowerCase().includes(query))
          );
        });
      }

      function refreshShoppingButtons() {
        clearShoppingButton.disabled = shoppingOrder.length === 0;
        moveMarkedButton.disabled = !shoppingOrder.some((id) => itemsById.get(id)?.done);
      }

      function sortedStores() {
        return [...stores].sort((a, b) => a.name.localeCompare(b.name));
      }

      function renderStoreList() {
        const fragment = document.createDocumentFragment();

        sortedStores().forEach((store) => {
          const bubble = document.createElement("sl-button");
          bubble.className = "store-pill-btn";
          bubble.size = "large";
          bubble.pill = true;
          bubble.title = `Remove ${store.name}`;
          bubble.setAttribute("aria-label", `Remove ${store.name}`);
          bubble.textContent = store.name;
          bubble.addEventListener("click", () => {
            removeStore(store.id);
          });
          applyStoreCircleStyle(bubble, store);
          fragment.append(bubble);
        });

        storeList.replaceChildren(fragment);
        storeCount.textContent = `${stores.length} store${stores.length === 1 ? "" : "s"}`;
        syncStageHeight();
      }

      function renderCatalogSection() {
        catalogCount.textContent = `${catalog.length} item${catalog.length === 1 ? "" : "s"}`;
        syncStageHeight();
      }

      function updateShoppingItemElement(item) {
        const parts = shoppingElements.get(item.id);
        if (!parts) {
          return;
        }

        const primaryStoreId = getPrimaryStoreId(item);

        parts.card.classList.toggle("done", item.done);
        parts.button.setAttribute("aria-pressed", String(item.done));
        parts.button.setAttribute(
          "aria-label",
          `${item.done ? "Unmark" : "Mark"} ${item.name} ${item.done ? "as not done" : "done"}`
        );
        parts.toggle.textContent = item.done ? "↺" : "";
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.store.hidden = primaryStoreId === null;
        parts.store.textContent = primaryStoreId === null ? "" : `Buy at ${getStoreName(primaryStoreId)}`;
      }

      function updateCatalogItemElement(item) {
        const parts = catalogElements.get(item.id);
        if (!parts) {
          return;
        }

        const onList = shoppingSet.has(item.id);
        parts.mainButton.setAttribute(
          "aria-label",
          onList ? `Remove ${item.name} from shopping list` : `Add ${item.name} to shopping list`
        );
        parts.note.hidden = !item.note;
        parts.note.textContent = item.note;
        parts.meta.textContent = formatRelativePurchase(getLastPurchased(item));
        parts.state.className = "catalog-state";
        parts.state.variant = onList ? "success" : "neutral";
        parts.state.textContent = onList ? "On list" : "Add to list";
        parts.storeTrigger.textContent = "Stores";
        parts.storeTrigger.disabled = stores.length === 0;

        const chips = document.createDocumentFragment();
        getItemStores(item).forEach((store) => {
          const chip = document.createElement("sl-tag");
          chip.className = "store-tag";
          chip.size = "small";
          chip.pill = true;
          chip.removable = true;
          chip.textContent = store.name;
          chip.addEventListener("sl-remove", (event) => {
            event.stopPropagation();
            event.preventDefault();
            toggleItemStoreSelection(item.id, store.id);
          });
          applyStoreCircleStyle(chip, store);
          chips.append(chip);
        });
        parts.storeTags.replaceChildren(chips);

        const menuOptions = document.createDocumentFragment();
        sortedStores().forEach((store) => {
          const option = document.createElement("sl-checkbox");
          option.className = "store-option-check";
          option.checked = getItemStoreIds(item).includes(store.id);
          option.textContent = store.name;
          option.addEventListener("sl-change", () => {
            toggleItemStoreSelection(item.id, store.id);
          });
          menuOptions.append(option);
        });
        parts.storeMenu.replaceChildren(menuOptions);
      }

      function createShoppingItemElement(item) {
        const card = document.createElement("sl-card");
        card.className = `shopping-card${item.done ? " done" : ""}`;

        const button = document.createElement("button");
        button.className = "shopping-row-button";
        button.type = "button";
        button.addEventListener("click", () => {
          const wasDone = item.done;
          item.done = !item.done;

          if (!wasDone && item.done) {
            item.purchaseHistory.push(new Date().toISOString());
            updateCatalogItemElement(item);
            persistState();
          } else if (wasDone && !item.done) {
            persistState();
          }

          updateShoppingItemElement(item);
          refreshShoppingButtons();
        });

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const store = document.createElement("div");
        store.className = "item-meta";

        const toggle = document.createElement("div");
        toggle.className = "shopping-toggle";
        toggle.setAttribute("aria-hidden", "true");

        main.append(name, note, store);
        button.append(main, toggle);
        card.append(button);

        shoppingElements.set(item.id, { card, button, note, store, toggle });
        updateShoppingItemElement(item);
      }

      function createCatalogItemElement(item) {
        const card = document.createElement("sl-card");
        card.className = "catalog-card";

        const mainButton = document.createElement("button");
        mainButton.className = "catalog-main-button";
        mainButton.type = "button";
        mainButton.addEventListener("click", () => {
          toggleShoppingListItem(item.id);
        });

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const note = document.createElement("div");
        note.className = "item-note";

        const meta = document.createElement("div");
        meta.className = "item-meta";

        const footer = document.createElement("div");
        footer.className = "catalog-footer";

        const state = document.createElement("sl-tag");
        state.className = "catalog-state";
        state.pill = true;

        const storeTools = document.createElement("div");
        storeTools.className = "catalog-store-tools";

        const storeTags = document.createElement("div");
        storeTags.className = "catalog-store-tags";

        const storeDropdown = document.createElement("sl-dropdown");
        storeDropdown.placement = "bottom-end";
        storeDropdown.hoist = true;

        const storeTrigger = document.createElement("sl-button");
        storeTrigger.className = "catalog-store-trigger";
        storeTrigger.slot = "trigger";
        storeTrigger.size = "small";
        storeTrigger.caret = true;
        storeTrigger.textContent = "Stores";
        storeTrigger.addEventListener("click", () => {
          if (stores.length === 0) {
            catalogTabs.show("stores");
            newStoreInput.focus();
          }
        });

        const storeMenu = document.createElement("div");
        storeMenu.className = "store-menu-list";
        storeMenu.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        storeDropdown.append(storeTrigger, storeMenu);
        storeTools.append(storeTags, storeDropdown);
        footer.append(state, storeTools);
        main.append(name, note, meta);
        mainButton.append(main);
        card.append(mainButton, footer);

        catalogElements.set(item.id, {
          card,
          mainButton,
          note,
          meta,
          state,
          storeTags,
          storeTrigger,
          storeMenu
        });
        updateCatalogItemElement(item);
      }

      function refreshCatalogPurchaseLabels() {
        catalog.forEach((item) => {
          updateCatalogItemElement(item);
        });
      }

      function storeGroupKey(storeId) {
        return storeId === null ? "any" : `store-${storeId}`;
      }

      function storeGroupName(storeId) {
        return storeId === null ? "Any Store" : getStoreName(storeId);
      }

      function groupedShoppingItems() {
        const groups = new Map();

        shoppingItems().forEach((item) => {
          const primaryStoreId = getPrimaryStoreId(item);
          const key = storeGroupKey(primaryStoreId);
          if (!groups.has(key)) {
            groups.set(key, {
              key,
              storeId: primaryStoreId,
              name: storeGroupName(primaryStoreId),
              items: []
            });
          }

          groups.get(key).items.push(item);
        });

        return [...groups.values()];
      }

      function moveStoreToTop(storeId) {
        const targetIds = shoppingOrder.filter((id) => getPrimaryStoreId(itemsById.get(id)) === storeId);
        if (targetIds.length === 0) {
          return;
        }

        const targetSet = new Set(targetIds);
        const remainingIds = shoppingOrder.filter((id) => !targetSet.has(id));
        shoppingOrder.splice(0, shoppingOrder.length, ...targetIds, ...remainingIds);
        persistState();
        syncShoppingVisibleList();
      }

      function syncShoppingVisibleList() {
        const groups = groupedShoppingItems();
        const nodes = groups.map((group) => {
          const details = document.createElement("sl-details");
          details.className = "shopping-group";
          details.open = !collapsedGroups.has(group.key);
          details.addEventListener("sl-after-show", () => {
            collapsedGroups.delete(group.key);
          });
          details.addEventListener("sl-after-hide", () => {
            collapsedGroups.add(group.key);
          });

          const summary = document.createElement("div");
          summary.slot = "summary";
          summary.className = "store-summary";

          const title = document.createElement("div");
          title.className = "store-summary-title";

          const strong = document.createElement("strong");
          strong.textContent = group.name;

          const count = document.createElement("span");
          count.textContent = `${group.items.length} item${group.items.length === 1 ? "" : "s"}`;

          title.append(strong, count);

          const moveButton = document.createElement("sl-icon-button");
          moveButton.className = "store-up";
          moveButton.src = UP_ICON;
          moveButton.label = `Move ${group.name} to top`;
          moveButton.addEventListener("click", (event) => {
            event.stopPropagation();
            moveStoreToTop(group.storeId);
          });

          summary.append(title, moveButton);

          const items = document.createElement("div");
          items.className = "shopping-items";
          items.append(...group.items.map((item) => shoppingElements.get(item.id).card));

          details.append(summary, items);
          return details;
        });

        shoppingList.replaceChildren(...nodes);
        shoppingEmpty.hidden = nodes.length > 0;
        refreshShoppingButtons();
        syncStageHeight();
      }

      function syncCatalogVisibleList() {
        const nodes = catalogItems().map((item) => catalogElements.get(item.id).card);
        catalogList.replaceChildren(...nodes);
        catalogEmpty.hidden = nodes.length > 0;
        syncStageHeight();
      }

      function moveItemToTop(id) {
        const index = shoppingOrder.indexOf(id);
        if (index <= 0) {
          return;
        }

        shoppingOrder.splice(index, 1);
        shoppingOrder.unshift(id);
      }

      function removeFromShoppingList(id) {
        if (!shoppingSet.has(id)) {
          return;
        }

        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;
        shoppingSet.delete(id);

        const index = shoppingOrder.indexOf(id);
        if (index !== -1) {
          shoppingOrder.splice(index, 1);
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
      }

      function removeStore(storeId) {
        const index = stores.findIndex((store) => store.id === storeId);
        if (index === -1) {
          return;
        }

        stores.splice(index, 1);
        catalog.forEach((item) => {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
          updateCatalogItemElement(item);
          updateShoppingItemElement(item);
        });

        renderStoreList();
        persistState();
        syncShoppingVisibleList();
      }

      function toggleItemStoreSelection(id, storeId) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        if (!stores.some((store) => store.id === storeId)) {
          return;
        }

        if (getItemStoreIds(item).includes(storeId)) {
          item.selectedStoreIds = getItemStoreIds(item).filter((id) => id !== storeId);
        } else {
          item.selectedStoreIds = [...getItemStoreIds(item), storeId];
        }

        updateCatalogItemElement(item);
        updateShoppingItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function addToShoppingList(id) {
        const item = itemsById.get(id);
        if (!item) {
          return;
        }

        item.done = false;

        if (shoppingSet.has(id)) {
          moveItemToTop(id);
        } else {
          shoppingSet.add(id);
          shoppingOrder.unshift(id);
          if (!shoppingElements.has(id)) {
            createShoppingItemElement(item);
          }
        }

        updateShoppingItemElement(item);
        updateCatalogItemElement(item);
        persistState();
        syncShoppingVisibleList();
      }

      function toggleShoppingListItem(id) {
        if (shoppingSet.has(id)) {
          removeFromShoppingList(id);
          syncShoppingVisibleList();
          return;
        }

        addToShoppingList(id);
      }

      function isCatalogHash(hash) {
        return hash === CATALOG_HASH || hash === "#all-items";
      }

      function isShoppingHash(hash) {
        return hash === SHOPPING_HASH || hash === "#shopping-list";
      }

      function syncPanelFromLocation() {
        const currentHash = window.location.hash;
        setFlipped(isCatalogHash(currentHash), false);
        const normalizedHash = isCatalogHash(currentHash) ? CATALOG_HASH : SHOPPING_HASH;
        if (currentHash !== normalizedHash) {
          window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${normalizedHash}`);
        }
      }

      function navigateToPanel(isFlipped) {
        const nextHash = isFlipped ? CATALOG_HASH : SHOPPING_HASH;
        if (window.location.hash === nextHash) {
          setFlipped(isFlipped, false);
          return;
        }

        window.location.hash = nextHash;
      }

      function setFlipped(isFlipped, updateUrl = true) {
        shoppingPanel.hidden = isFlipped;
        catalogPanel.hidden = !isFlipped;
        if (updateUrl) {
          navigateToPanel(isFlipped);
          return;
        }
        syncStageHeight();
      }

      catalog.forEach((item) => {
        createCatalogItemElement(item);

        if (shoppingSet.has(item.id)) {
          createShoppingItemElement(item);
        }
      });

      renderStoreSuggestions();
      renderStoreList();
      renderCatalogSection();
      syncShoppingVisibleList();
      syncCatalogVisibleList();
      if (!isCatalogHash(window.location.hash) && !isShoppingHash(window.location.hash)) {
        window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}${SHOPPING_HASH}`);
      }
      syncPanelFromLocation();

      shoppingSearch.addEventListener("sl-input", syncShoppingVisibleList);
      shoppingSearch.addEventListener("sl-clear", syncShoppingVisibleList);
      catalogSearch.addEventListener("sl-input", syncCatalogVisibleList);
      catalogSearch.addEventListener("sl-clear", syncCatalogVisibleList);
      window.addEventListener("hashchange", syncPanelFromLocation);

      storeForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const rawName = getFieldValue(newStoreInput).trim();
        if (!rawName) {
          return;
        }

        const matchedBrand = inferStoreBrand(rawName);
        const resolvedName = matchedBrand?.name || rawName;

        const existingStore = stores.find((store) => {
          if (matchedBrand && store.brandKey === matchedBrand.key) {
            return true;
          }

          return store.name.toLowerCase() === resolvedName.toLowerCase();
        });
        if (!existingStore) {
          const store = {
            id: nextStoreId++,
            name: resolvedName,
            brandKey: matchedBrand?.key || null
          };
          stores.push(store);
        }

        renderStoreList();
        refreshCatalogPurchaseLabels();
        persistState();
        newStoreInput.value = "";
        newStoreInput.focus();
      });

      clearShoppingButton.addEventListener("click", () => {
        const hasUnmarkedItems = shoppingOrder.some((id) => !itemsById.get(id).done);
        if (hasUnmarkedItems) {
          const confirmed = window.confirm("Clear the shopping list? You still have unmarked items.");
          if (!confirmed) {
            return;
          }
        }

        shoppingOrder.splice(0, shoppingOrder.length);
        shoppingSet.clear();

        catalog.forEach((item) => {
          item.done = false;
          updateCatalogItemElement(item);
        });

        persistState();
        syncShoppingVisibleList();
      });

      moveMarkedButton.addEventListener("click", () => {
        if (!shoppingOrder.some((id) => itemsById.get(id).done)) {
          return;
        }

        const openItems = shoppingOrder.filter((id) => !itemsById.get(id).done);
        const doneItems = shoppingOrder.filter((id) => itemsById.get(id).done);
        shoppingOrder.splice(0, shoppingOrder.length, ...openItems, ...doneItems);
        persistState();
        syncShoppingVisibleList();
      });

      showCatalogButton.addEventListener("click", () => {
        setFlipped(true);
      });

      showShoppingButton.addEventListener("click", () => {
        setFlipped(false);
      });

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = getFieldValue(newItemInput).trim();
        if (!name) {
          return;
        }

        const item = {
          id: nextId++,
          name,
          note: "",
          done: false,
          purchaseHistory: [],
          selectedStoreIds: []
        };

        catalog.unshift(item);
        itemsById.set(item.id, item);
        createCatalogItemElement(item);
        persistState();
        renderCatalogSection();
        newItemInput.value = "";
        syncCatalogVisibleList();
        newItemInput.focus();
      });

      window.addEventListener("resize", syncStageHeight);
      window.setInterval(refreshCatalogPurchaseLabels, 60 * 1000);
      syncStageHeight();
    </script>
  </body>
</html>
